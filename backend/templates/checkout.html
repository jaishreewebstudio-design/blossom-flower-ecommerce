<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7fa,
                    #fdf1f5,
                    #fff
                );

            min-height: 100vh;

            color: #333;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            background: #ffffff;

            border-bottom:
                1px solid #eadde2;

            padding: 18px 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .logo {

            font-size: 25px;

            font-weight: 700;

            color: #c2185b;

            text-decoration: none;
        }

        .back-btn {

            text-decoration: none;

            color: #c2185b;

            border:
                1px solid #c2185b;

            padding:
                9px 18px;

            border-radius: 8px;

            font-weight: 600;

            transition: 0.2s;
        }

        .back-btn:hover {

            background: #c2185b;

            color: white;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .container {

            width: 90%;

            max-width: 1150px;

            margin:
                35px auto 60px;
        }

        .page-title {

            text-align: center;

            color: #9c174b;

            font-size: 34px;

            margin-bottom: 8px;
        }

        .page-subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .layout {

            display: grid;

            grid-template-columns:
                1.25fr 0.75fr;

            gap: 25px;

            align-items: start;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background: #ffffff;

            border:
                1px solid #eadde2;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 8px 25px
                rgba(80, 30, 50, 0.08);
        }

        .card-title {

            color: #9c174b;

            font-size: 21px;

            margin-bottom: 20px;

            padding-bottom: 12px;

            border-bottom:
                1px solid #eadde2;
        }

        /* =====================================================
           SELECTED ITEMS
        ===================================================== */

        .items-container {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .item {

            display: flex;

            align-items: center;

            gap: 15px;

            padding: 14px;

            border:
                1px solid #eadde2;

            border-radius: 12px;

            background: #fffafd;
        }

        .item-image {

            width: 85px;

            height: 85px;

            object-fit: cover;

            border-radius: 10px;

            border:
                1px solid #eee;
        }

        .item-info {

            flex: 1;
        }

        .item-name {

            font-size: 18px;

            font-weight: 700;

            color: #444;

            margin-bottom: 6px;
        }

        .item-price {

            color: #c2185b;

            font-weight: 600;

            margin-bottom: 5px;
        }

        .item-quantity {

            color: #777;

            font-size: 14px;
        }

        .item-subtotal {

            font-weight: 700;

            color: #333;

            white-space: nowrap;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 17px;
        }

        .form-group label {

            display: block;

            font-weight: 600;

            margin-bottom: 7px;

            color: #444;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            border:
                1px solid #d8cbd0;

            border-radius: 8px;

            padding:
                12px 13px;

            font-size: 15px;

            outline: none;

            background: #fff;
        }

        .form-group textarea {

            min-height: 100px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            border-color: #c2185b;

            box-shadow:
                0 0 0 3px
                rgba(194, 24, 91, 0.08);
        }

        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary-row {

            display: flex;

            justify-content: space-between;

            padding:
                11px 0;

            color: #555;
        }

        .summary-total {

            display: flex;

            justify-content: space-between;

            border-top:
                1px solid #eadde2;

            margin-top: 8px;

            padding-top: 17px;

            font-size: 22px;

            font-weight: 700;

            color: #9c174b;
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .place-order-btn {

            width: 100%;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #c2185b,
                    #ad1457
                );

            color: white;

            padding: 14px;

            border-radius: 9px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 20px;

            transition: 0.2s;
        }

        .place-order-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 7px 15px
                rgba(194, 24, 91, 0.22);
        }

        .place-order-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 13px 15px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            font-weight: 600;
        }

        .message.success {

            display: block;

            background: #e8f7ed;

            color: #187a3d;

            border:
                1px solid #bde5ca;
        }

        .message.error {

            display: block;

            background: #fff0f0;

            color: #b42318;

            border:
                1px solid #f1c1c1;
        }

        .loading {

            text-align: center;

            padding: 35px;

            color: #777;
        }

        .empty {

            text-align: center;

            padding: 40px 20px;

            color: #777;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 800px
        ) {

            .layout {

                grid-template-columns: 1fr;
            }

            .header {

                padding:
                    15px 5%;
            }

            .page-title {

                font-size: 28px;
            }
        }

        @media (
            max-width: 500px
        ) {

            .item {

                align-items: flex-start;
            }

            .item-image {

                width: 65px;

                height: 65px;
            }

            .item-subtotal {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <a
        href="/flower"
        class="logo"
    >
        🌸 Blossom Flower Shop
    </a>


    <a
        href="/cart"
        class="back-btn"
    >
        ← Back to Cart
    </a>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">

    <h1 class="page-title">
        Checkout
    </h1>

    <p class="page-subtitle">
        Review your selected flowers and place your order.
    </p>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="loading"
        class="loading"
    >
        Loading selected items...
    </div>


    <div
        id="checkoutContent"
        class="layout"
        style="display:none;"
    >


        <!-- =================================================
             SELECTED ITEMS
        ================================================= -->

        <section class="card">

            <h2 class="card-title">
                Selected Flowers
            </h2>


            <div
                id="itemsContainer"
                class="items-container"
            ></div>

        </section>


        <!-- =================================================
             CUSTOMER DETAILS
        ================================================= -->

        <section class="card">

            <h2 class="card-title">
                Order Details
            </h2>


            <form
                id="checkoutForm"
            >


                <div class="form-group">

                    <label for="customerName">
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter complete delivery address"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="payment">
                        Payment Method
                    </label>

                    <select
                        id="payment"
                        required
                    >

                        <option value="">
                            Select payment method
                        </option>

                        <option value="Cash on Delivery">
                            Cash on Delivery
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="Card">
                            Card
                        </option>

                    </select>

                </div>


                <!-- =================================================
                     SUMMARY
                ================================================= -->

                <div class="summary-row">

                    <span>
                        Selected Items
                    </span>

                    <strong id="selectedCount">
                        0
                    </strong>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹<span id="totalAmount">0.00</span>
                    </span>

                </div>


                <button
                    type="submit"
                    id="placeOrderBtn"
                    class="place-order-btn"
                >
                    Place Order
                </button>


            </form>

        </section>

    </div>

</main>


<script>

    /* =========================================================
       GLOBAL VARIABLES
    ========================================================= */

    let selectedItems = [];

    let selectedCartIds = [];

    let checkoutTotal = 0;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loading =
        document.getElementById(
            "loading"
        );

    const checkoutContent =
        document.getElementById(
            "checkoutContent"
        );

    const itemsContainer =
        document.getElementById(
            "itemsContainer"
        );

    const message =
        document.getElementById(
            "message"
        );

    const selectedCount =
        document.getElementById(
            "selectedCount"
        );

    const totalAmount =
        document.getElementById(
            "totalAmount"
        );

    const checkoutForm =
        document.getElementById(
            "checkoutForm"
        );

    const placeOrderBtn =
        document.getElementById(
            "placeOrderBtn"
        );


    /* =========================================================
       SHOW MESSAGE
    ========================================================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className =
            "message " + type;
    }


    /* =========================================================
       LOAD SELECTED CHECKOUT ITEMS
    ========================================================= */

    async function loadCheckout() {

        loading.style.display =
            "block";

        checkoutContent.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/api/checkout/selected",
                    {
                        method: "GET",

                        credentials: "include"
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Unable to load checkout"
                );
            }


            selectedItems =
                data.items || [];


            selectedCartIds =
                data.selected_cart_ids || [];


            checkoutTotal =
                Number(
                    data.total || 0
                );


            if (
                selectedItems.length === 0
            ) {

                throw new Error(
                    "No items selected for checkout."
                );
            }


            renderItems();


            selectedCount.textContent =
                selectedItems.length;


            totalAmount.textContent =
                checkoutTotal.toFixed(2);


            loading.style.display =
                "none";

            checkoutContent.style.display =
                "grid";


        } catch (error) {

            loading.style.display =
                "none";


            checkoutContent.style.display =
                "none";


            showMessage(
                error.message,
                "error"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "/cart";

                },
                1800
            );
        }
    }


    /* =========================================================
       RENDER ITEMS
    ========================================================= */

    function renderItems() {

        itemsContainer.innerHTML = "";


        selectedItems.forEach(
            function(item) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "item";


                const image =
                    document.createElement(
                        "img"
                    );


                image.className =
                    "item-image";


                image.src =
                    item.image ||
                    "https://via.placeholder.com/100x100?text=Flower";


                image.alt =
                    item.name;


                image.onerror =
                    function() {

                        this.src =
                            "https://via.placeholder.com/100x100?text=Flower";

                    };


                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "item-info";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "item-name";


                name.textContent =
                    item.name;


                const price =
                    document.createElement(
                        "div"
                    );


                price.className =
                    "item-price";


                price.textContent =
                    "₹" +
                    Number(
                        item.price || 0
                    ).toFixed(2) +
                    " each";


                const quantity =
                    document.createElement(
                        "div"
                    );


                quantity.className =
                    "item-quantity";


                quantity.textContent =
                    "Quantity: " +
                    item.quantity;


                info.appendChild(
                    name
                );

                info.appendChild(
                    price
                );

                info.appendChild(
                    quantity
                );


                const subtotal =
                    document.createElement(
                        "div"
                    );


                subtotal.className =
                    "item-subtotal";


                subtotal.textContent =
                    "₹" +
                    Number(
                        item.subtotal || 0
                    ).toFixed(2);


                div.appendChild(
                    image
                );

                div.appendChild(
                    info
                );

                div.appendChild(
                    subtotal
                );


                itemsContainer.appendChild(
                    div
                );

            }
        );
    }


    /* =========================================================
       PLACE ORDER
    ========================================================= */

    checkoutForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (
                selectedCartIds.length === 0
            ) {

                showMessage(
                    "Please select at least one flower.",
                    "error"
                );

                return;
            }


            const customerName =
                document.getElementById(
                    "customerName"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const address =
                document.getElementById(
                    "address"
                ).value.trim();


            const payment =
                document.getElementById(
                    "payment"
                ).value;


            if (!customerName) {

                showMessage(
                    "Please enter customer name.",
                    "error"
                );

                return;
            }


            if (!phone) {

                showMessage(
                    "Please enter phone number.",
                    "error"
                );

                return;
            }


            if (!address) {

                showMessage(
                    "Please enter delivery address.",
                    "error"
                );

                return;
            }


            if (!payment) {

                showMessage(
                    "Please select payment method.",
                    "error"
                );

                return;
            }


            placeOrderBtn.disabled =
                true;

            placeOrderBtn.textContent =
                "Placing Order...";


            try {

                const response =
                    await fetch(
                        "/api/orders",
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    customer_name:
                                        customerName,

                                    phone:
                                        phone,

                                    address:
                                        address,

                                    payment:
                                        payment,

                                    cart_ids:
                                        selectedCartIds

                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to place order"
                    );
                }


                showMessage(
                    "Order placed successfully! Order #" +
                    data.order.id,
                    "success"
                );


                /*
                    Backend already:
                    - created order
                    - created order items
                    - reduced stock
                    - marked selected cart items Ordered
                    - cleared checkout selection
                */


                setTimeout(
                    function() {

                        window.location.href =
                            "/orders";

                    },
                    1200
                );


            } catch (error) {

                showMessage(
                    error.message,
                    "error"
                );


                placeOrderBtn.disabled =
                    false;

                placeOrderBtn.textContent =
                    "Place Order";
            }

        }
    );


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadCheckout();

</script>


</body>

</html>
