<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            background: white;

            padding: 18px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;

            white-space: nowrap;
        }


        nav ul {

            list-style: none;

            display: flex;

            align-items: center;

            gap: 25px;
        }


        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;
        }


        nav ul li a:hover {

            color: #d63384;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .checkout-section {

            max-width: 1000px;

            margin: 45px auto;

            padding: 0 20px;
        }


        .checkout-card {

            background: white;

            border-radius: 18px;

            padding: 32px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .page-title {

            color: #c2185b;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .page-subtitle {

            color: #777;

            margin-bottom: 28px;

            font-size: 15px;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 13px 16px;

            border-radius: 9px;

            margin-bottom: 20px;

            font-weight: bold;
        }


        .message.success {

            display: block;

            background: #e6f8ed;

            color: #16803c;

            border: 1px solid #b7e5c7;
        }


        .message.error {

            display: block;

            background: #ffe7e7;

            color: #b42323;

            border: 1px solid #f2b8b8;
        }


        /* =====================================================
           SELECTED PRODUCTS
        ===================================================== */

        .selected-products {

            margin-bottom: 30px;

            border:
                1px solid #f0d6df;

            border-radius: 12px;

            overflow: hidden;
        }


        .selected-products-title {

            background: #fff0f5;

            padding: 16px 18px;

            color: #c2185b;

            font-size: 18px;

            font-weight: bold;

            border-bottom:
                1px solid #f0d6df;
        }


        .selected-product {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 18px;

            border-bottom:
                1px solid #eeeeee;
        }


        .selected-product:last-child {

            border-bottom: none;
        }


        .product-info {

            min-width: 0;
        }


        .product-name {

            font-size: 17px;

            font-weight: bold;

            color: #444;

            margin-bottom: 7px;
        }


        .product-quantity {

            color: #777;

            font-size: 14px;
        }


        .product-subtotal {

            color: #d63384;

            font-weight: bold;

            font-size: 17px;

            white-space: nowrap;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-title {

            color: #c2185b;

            font-size: 20px;

            margin-bottom: 20px;

            padding-bottom: 10px;

            border-bottom:
                1px solid #f0d6df;
        }


        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 16px;

            font-weight: bold;

            color: #444;
        }


        .required {

            color: #d63384;
        }


        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 14px 16px;

            border:
                1px solid #e7bfd0;

            border-radius: 9px;

            font-size: 16px;

            outline: none;

            background: #fffafb;

            transition: 0.2s;
        }


        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            border-color: #d63384;

            box-shadow:
                0 0 0 3px
                rgba(214, 51, 132, 0.08);
        }


        .form-group textarea {

            min-height: 120px;

            resize: vertical;
        }


        /* =====================================================
           TWO COLUMN FORM
        ===================================================== */

        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        /* =====================================================
           TOTAL
        ===================================================== */

        .total-box {

            margin-top: 28px;

            padding: 20px 0;

            border-top:
                1px solid #eee;

            border-bottom:
                1px solid #eee;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .total-label {

            color: #c2185b;

            font-size: 22px;

            font-weight: bold;
        }


        .total-price {

            color: #d63384;

            font-size: 26px;

            font-weight: bold;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .button-area {

            display: flex;

            gap: 15px;

            margin-top: 25px;
        }


        .btn {

            flex: 1;

            padding: 14px 20px;

            border: none;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .back-btn {

            background: #ffe0eb;

            color: #c2185b;
        }


        .back-btn:hover {

            background: #f8c5d4;
        }


        .place-btn {

            background: #d63384;

            color: white;
        }


        .place-btn:hover {

            background: #c2185b;
        }


        .place-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-box {

            text-align: center;

            padding: 50px 20px;
        }


        .empty-box h2 {

            color: #d63384;

            margin-bottom: 10px;
        }


        .empty-box p {

            color: #777;

            margin-bottom: 20px;
        }


        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: bold;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            text-align: center;

            padding: 30px;

            color: #777;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }


            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            .checkout-section {

                margin-top: 25px;
            }


            .checkout-card {

                padding: 20px;
            }


            .form-row {

                grid-template-columns: 1fr;

                gap: 0;
            }


            .button-area {

                flex-direction: column;
            }


            .selected-product {

                align-items: flex-start;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>


    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>

            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>

            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================================================
     CHECKOUT
========================================================= -->

<section class="checkout-section">

    <div class="checkout-card">

        <h1 class="page-title">
            🌸 Checkout
        </h1>

        <p class="page-subtitle">
            Complete your delivery details to place your order.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <!-- =================================================
             SELECTED PRODUCTS
        ================================================== -->

        <div
            id="selectedProducts"
            class="selected-products"
        >

            <div class="selected-products-title">
                🌸 Selected Flowers
            </div>

            <div id="productList">

                <div class="loading">
                    Loading selected flowers...
                </div>

            </div>

        </div>


        <!-- =================================================
             CUSTOMER DETAILS
        ================================================== -->

        <h2 class="form-title">
            👤 Customer & Delivery Details
        </h2>


        <div class="form-row">

            <div class="form-group">

                <label for="customerName">
                    Customer Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                    <span class="required">*</span>
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                >

            </div>

        </div>


        <div class="form-group">

            <label for="address">
                Delivery Address
                <span class="required">*</span>
            </label>

            <textarea
                id="address"
                placeholder="Enter complete delivery address"
            ></textarea>

        </div>


        <div class="form-group">

            <label for="payment">
                Payment Method
                <span class="required">*</span>
            </label>

            <select id="payment">

                <option value="">
                    Select Payment Method
                </option>

                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Card">
                    Card
                </option>

            </select>

        </div>


        <!-- =================================================
             TOTAL
        ================================================== -->

        <div class="total-box">

            <div class="total-label">
                Total
            </div>

            <div
                id="totalPrice"
                class="total-price"
            >
                ₹0.00
            </div>

        </div>


        <!-- =================================================
             BUTTONS
        ================================================== -->

        <div class="button-area">

            <button
                type="button"
                class="btn back-btn"
                onclick="goBackToCart()"
            >
                ← Back to Cart
            </button>


            <button
                type="button"
                id="placeOrderButton"
                class="btn place-btn"
                onclick="placeOrder()"
            >
                🌸 Place Order
            </button>

        </div>

    </div>

</section>


<script>

/* =========================================================
   API
========================================================= */

const API_URL = "";


/* =========================================================
   VARIABLES
========================================================= */

let selectedCartIds = [];

let selectedProducts = [];

let selectedTotal = 0;


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem("currentUser");

    if (!userData) {
        return null;
    }

    try {

        return JSON.parse(userData);

    } catch (error) {

        console.error(
            "Current User Error:",
            error
        );

        return null;
    }
}


/* =========================================================
   SELECTED CART IDS
========================================================= */

function getSelectedCartIds() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const urlIds =
        params.get("cart_ids");


    if (urlIds) {

        return urlIds
            .split(",")
            .map(id => Number(id))
            .filter(
                id =>
                    Number.isInteger(id) &&
                    id > 0
            );
    }


    const savedIds =
        localStorage.getItem(
            "selectedCartIds"
        );


    if (!savedIds) {
        return [];
    }


    try {

        const parsed =
            JSON.parse(savedIds);


        if (!Array.isArray(parsed)) {
            return [];
        }


        return parsed
            .map(id => Number(id))
            .filter(
                id =>
                    Number.isInteger(id) &&
                    id > 0
            );

    } catch (error) {

        console.error(
            "Selected Cart IDs Error:",
            error
        );

        return [];
    }
}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");


    message.textContent =
        text;


    message.className =
        `message ${type}`;
}


/* =========================================================
   LOAD CHECKOUT
========================================================= */

async function loadCheckout() {

    const user =
        getCurrentUser();


    if (!user || !user.id) {

        showMessage(
            "Please login before checkout.",
            "error"
        );

        document.getElementById(
            "placeOrderButton"
        ).disabled = true;

        return;
    }


    selectedCartIds =
        getSelectedCartIds();


    if (selectedCartIds.length === 0) {

        document.getElementById(
            "selectedProducts"
        ).innerHTML = `

            <div class="empty-box">

                <h2>
                    🌸 No Flower Selected
                </h2>

                <p>
                    Please go back to cart and select
                    at least one flower.
                </p>

                <a
                    href="{{ url_for('cart_page') }}"
                    class="shop-btn"
                >
                    ← Go to Cart
                </a>

            </div>

        `;


        document.getElementById(
            "placeOrderButton"
        ).disabled = true;


        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`,
                {
                    method: "GET",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart."
            );
        }


        const cart =
            Array.isArray(data.cart)
                ? data.cart
                : [];


        /*
         * ONLY SELECTED CART ITEMS
         */

        selectedProducts =
            cart.filter(
                item => {

                    return (
                        selectedCartIds.includes(
                            Number(item.id)
                        ) &&
                        String(
                            item.status || ""
                        ).toLowerCase() !== "ordered"
                    );

                }
            );


        if (
            selectedProducts.length === 0
        ) {

            throw new Error(
                "Selected cart items are no longer available."
            );
        }


        /*
         * CALCULATE SELECTED TOTAL
         */

        selectedTotal =
            selectedProducts.reduce(
                (total, item) => {

                    const price =
                        Number(item.price || 0);

                    const quantity =
                        Number(item.quantity || 0);

                    return total +
                        (price * quantity);

                },
                0
            );


        displaySelectedProducts();

        fillCustomerName();


        document.getElementById(
            "totalPrice"
        ).textContent =
            `₹${selectedTotal.toFixed(2)}`;


    } catch (error) {

        console.error(
            "Checkout Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to load checkout.",
            "error"
        );


        document.getElementById(
            "placeOrderButton"
        ).disabled = true;
    }
}


/* =========================================================
   DISPLAY SELECTED PRODUCTS
========================================================= */

function displaySelectedProducts() {

    const productList =
        document.getElementById(
            "productList"
        );


    productList.innerHTML = "";


    selectedProducts.forEach(
        item => {

            const price =
                Number(item.price || 0);


            const quantity =
                Number(item.quantity || 0);


            const subtotal =
                price * quantity;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "selected-product";


            row.innerHTML = `

                <div class="product-info">

                    <div class="product-name">

                        🌸
                        ${escapeHtml(
                            item.name ||
                            "Flower"
                        )}

                    </div>

                    <div class="product-quantity">

                        Quantity:
                        ${quantity}

                        ×

                        ₹${price.toFixed(2)}

                    </div>

                </div>


                <div class="product-subtotal">

                    ₹${subtotal.toFixed(2)}

                </div>

            `;


            productList.appendChild(row);

        }
    );
}


/* =========================================================
   CUSTOMER NAME
========================================================= */

function fillCustomerName() {

    const user =
        getCurrentUser();


    const input =
        document.getElementById(
            "customerName"
        );


    if (
        user &&
        user.name &&
        !input.value
    ) {

        input.value =
            user.name;
    }
}


/* =========================================================
   PLACE ORDER
========================================================= */

async function placeOrder() {

    const user =
        getCurrentUser();


    if (!user || !user.id) {

        showMessage(
            "Please login before placing the order.",
            "error"
        );

        return;
    }


    if (
        selectedCartIds.length === 0 ||
        selectedProducts.length === 0
    ) {

        showMessage(
            "Please select at least one flower from cart.",
            "error"
        );

        return;
    }


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const address =
        document.getElementById(
            "address"
        ).value.trim();


    const payment =
        document.getElementById(
            "payment"
        ).value;


    if (!customerName) {

        showMessage(
            "Please enter customer name.",
            "error"
        );

        return;
    }


    if (!/^[0-9]{10}$/.test(phone)) {

        showMessage(
            "Please enter a valid 10-digit phone number.",
            "error"
        );

        return;
    }


    if (!address) {

        showMessage(
            "Please enter delivery address.",
            "error"
        );

        return;
    }


    if (!payment) {

        showMessage(
            "Please select payment method.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "placeOrderButton"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Placing Order...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/orders`,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                user.id,

                            customer_name:
                                customerName,

                            phone:
                                phone,

                            address:
                                address,

                            payment:
                                payment,

                            /*
                             * IMPORTANT:
                             * ONLY SELECTED ITEMS
                             */

                            cart_ids:
                                selectedCartIds
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to place order."
            );
        }


        /*
         * Clear only selected IDs.
         */

        localStorage.removeItem(
            "selectedCartIds"
        );


        alert(
            "Order placed successfully! 🌸"
        );


        /*
         * Redirect to Orders.
         */

        window.location.href =
            "{{ url_for('orders_page') }}";


    } catch (error) {

        console.error(
            "Place Order Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to place order.",
            "error"
        );


        button.disabled = false;

        button.textContent =
            "🌸 Place Order";
    }
}


/* =========================================================
   BACK TO CART
========================================================= */

function goBackToCart() {

    window.location.href =
        "{{ url_for('cart_page') }}";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCheckout();

    }
);

</script>

</body>

</html>
