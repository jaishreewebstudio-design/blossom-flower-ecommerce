<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Blossom Flower Shop</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff5f8,
                    #fffafd
                );

            color: #333;

            min-height: 100vh;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .dashboard-header {

            background: white;

            padding: 20px 50px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            box-shadow:
                0 3px 18px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 1000;

        }


        .dashboard-header h1 {

            color: #d63384;

            font-size: 27px;

            white-space: nowrap;

        }


        nav {

            display: flex;

            gap: 25px;

            align-items: center;

            flex-wrap: wrap;

            justify-content: center;

        }


        nav a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.2s;

        }


        nav a:hover {

            color: #d63384;

        }


        /* =====================================================
           CART SECTION
        ===================================================== */

        .cart-section {

            width: 100%;

            padding:
                50px 20px 70px;

        }


        .cart-container {

            max-width: 1100px;

            margin: auto;

        }


        /* =====================================================
           PAGE TITLE
        ===================================================== */

        .page-title {

            text-align: center;

            margin-bottom: 35px;

        }


        .page-title h2 {

            color: #c2185b;

            font-size: 32px;

            margin-bottom: 8px;

        }


        .page-title p {

            color: #777;

            font-size: 15px;

        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 15px 18px;

            margin-bottom: 20px;

            border-radius: 10px;

            font-weight: 600;

        }


        .success-message {

            background: #e8f7ed;

            border:
                1px solid #b7e4c7;

            color: #218838;

        }


        .error-message {

            background: #fff0f0;

            border:
                1px solid #f0b8b8;

            color: #c62828;

        }


        /* =====================================================
           CART CARD
        ===================================================== */

        .cart-box {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.08);

        }


        /* =====================================================
           CART HEADER
        ===================================================== */

        .cart-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            padding-bottom: 18px;

            margin-bottom: 20px;

            border-bottom:
                2px solid #f3c1d3;

        }


        .cart-header h3 {

            color: #c2185b;

            font-size: 21px;

        }


        .cart-count {

            background: #ffe0ea;

            color: #c2185b;

            padding:
                7px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

        }


        /* =====================================================
           CART ITEMS
        ===================================================== */

        #cartItems {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .cart-item {

            display: flex;

            align-items: center;

            gap: 18px;

            padding: 18px;

            border:
                1px solid #eee;

            border-radius: 14px;

            background: #fff;

            transition: 0.2s;

        }


        .cart-item:hover {

            border-color: #f0b3ca;

            box-shadow:
                0 5px 18px
                rgba(214, 51, 132, 0.08);

        }


        /* =====================================================
           CHECKBOX
        ===================================================== */

        .select-area {

            width: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

        }


        .select-checkbox {

            width: 20px;

            height: 20px;

            cursor: pointer;

            accent-color: #d63384;

        }


        .select-checkbox:disabled {

            cursor: not-allowed;

            opacity: 0.5;

        }


        /* =====================================================
           FLOWER IMAGE
        ===================================================== */

        .cart-image {

            width: 95px;

            height: 95px;

            object-fit: cover;

            border-radius: 12px;

            background: #fff5f8;

            flex-shrink: 0;

            border:
                1px solid #f3d5df;

        }


        /* =====================================================
           ITEM INFO
        ===================================================== */

        .cart-item-info {

            flex: 1;

            min-width: 180px;

        }


        .cart-item-info h4 {

            color: #c2185b;

            font-size: 19px;

            margin-bottom: 8px;

        }


        .cart-item-info p {

            color: #666;

            font-size: 14px;

            margin:
                5px 0;

        }


        .price-text {

            color: #d63384;

            font-weight: bold;

        }


        /* =====================================================
           QUANTITY
        ===================================================== */

        .quantity-box {

            display: flex;

            align-items: center;

            border:
                1px solid #e3c1cf;

            border-radius: 9px;

            overflow: hidden;

            flex-shrink: 0;

        }


        .quantity-btn {

            width: 34px;

            height: 34px;

            border: none;

            background: #ffe8ef;

            color: #c2185b;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .quantity-btn:hover {

            background: #ffd3e1;

        }


        .quantity-value {

            min-width: 38px;

            text-align: center;

            font-weight: bold;

            color: #555;

        }


        /* =====================================================
           SUBTOTAL
        ===================================================== */

        .item-subtotal {

            min-width: 105px;

            text-align: right;

            font-size: 18px;

            font-weight: bold;

            color: #d63384;

            flex-shrink: 0;

        }


        /* =====================================================
           REMOVE BUTTON
        ===================================================== */

        .remove-btn {

            border: none;

            background: #fff0f0;

            color: #c62828;

            padding:
                9px 12px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;

            flex-shrink: 0;

        }


        .remove-btn:hover {

            background: #ffdede;

        }


        /* =====================================================
           ORDERED ITEM
        ===================================================== */

        .ordered-item {

            background:
                #f8fff9;

            border-color:
                #c8e8d1;

        }


        .ordered-badge {

            display: inline-block;

            margin-top: 8px;

            padding:
                5px 10px;

            background:
                #e8f7ed;

            color:
                #218838;

            border:
                1px solid #b7e4c7;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .ordered-note {

            color: #218838 !important;

            font-size: 12px !important;

            margin-top: 5px;

        }


        /* =====================================================
           EMPTY CART
        ===================================================== */

        .empty-cart {

            text-align: center;

            padding:
                70px 20px;

        }


        .empty-cart-icon {

            font-size: 65px;

            margin-bottom: 15px;

        }


        .empty-cart h2 {

            color: #d63384;

            margin-bottom: 10px;

        }


        .empty-cart p {

            color: #777;

            margin-bottom: 25px;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            text-align: center;

            padding: 50px;

            color: #777;

            font-size: 16px;

        }


        /* =====================================================
           BOTTOM SUMMARY
        ===================================================== */

        .cart-bottom {

            margin-top: 25px;

            padding: 23px;

            background:
                #fff5f8;

            border:
                1px solid #f4c8d9;

            border-radius: 14px;

        }


        .summary-row {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

        }


        .summary-label {

            color: #555;

            font-weight: bold;

        }


        .summary-value {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;

        }


        /* =====================================================
           SELECTED INFO
        ===================================================== */

        .selected-info {

            margin-top: 12px;

            color: #777;

            font-size: 14px;

        }


        .selected-info strong {

            color: #c2185b;

        }


        /* =====================================================
           BUTTON ROW
        ===================================================== */

        .button-row {

            display: flex;

            gap: 15px;

            margin-top: 22px;

        }


        .btn {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-align: center;

            text-decoration: none;

            transition: 0.2s;

        }


        .btn-primary {

            background: #d63384;

            color: white;

        }


        .btn-primary:hover {

            background: #ad1457;

        }


        .btn-primary:disabled {

            background: #c9a0b2;

            cursor: not-allowed;

        }


        .btn-secondary {

            background: #ffe0ea;

            color: #c2185b;

        }


        .btn-secondary:hover {

            background: #ffd0df;

        }


        /* =====================================================
           CART ITEM SELECTED STATE
        ===================================================== */

        .cart-item.selected {

            border:
                2px solid #d63384;

            background:
                #fff8fb;

            box-shadow:
                0 5px 20px
                rgba(214, 51, 132, 0.10);

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .dashboard-header {

                padding:
                    18px 25px;

            }


            .cart-item {

                flex-wrap: wrap;

            }


            .cart-item-info {

                min-width:
                    calc(100% - 150px);

            }


            .item-subtotal {

                margin-left:
                    auto;

            }

        }


        @media (max-width: 700px) {

            .dashboard-header {

                flex-direction: column;

                gap: 15px;

                padding: 20px;

            }


            nav {

                gap: 15px;

            }


            .cart-section {

                padding:
                    30px 12px 50px;

            }


            .cart-box {

                padding: 18px;

            }


            .page-title h2 {

                font-size: 27px;

            }


            .cart-item {

                align-items:
                    flex-start;

            }


            .cart-image {

                width: 75px;

                height: 75px;

            }


            .cart-item-info h4 {

                font-size: 17px;

            }


            .quantity-box {

                margin-left:
                    48px;

            }


            .item-subtotal {

                width: 100%;

                text-align:
                    left;

                margin-left:
                    48px;

            }


            .remove-btn {

                margin-left:
                    48px;

            }


            .button-row {

                flex-direction:
                    column;

            }

        }


        @media (max-width: 480px) {

            .cart-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .cart-item {

                gap: 12px;

                padding: 14px;

            }


            .select-area {

                width: 24px;

            }


            .cart-image {

                width: 65px;

                height: 65px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="dashboard-header">

    <h1>
        🌸 Blossom Flower Shop
    </h1>


    <nav>

        <a href="{{ url_for('dashboard_page') }}">
            Dashboard
        </a>

        <a href="{{ url_for('home_page') }}">
            Home
        </a>

        <a href="{{ url_for('flowers_page') }}">
            Flowers
        </a>

        <a href="{{ url_for('cart_page') }}">
            Cart
        </a>

        <a href="{{ url_for('orders_page') }}">
            Orders
        </a>

    </nav>

</header>


<!-- =========================================================
     CART SECTION
========================================================= -->

<section class="cart-section">

    <div class="cart-container">


        <!-- PAGE TITLE -->

        <div class="page-title">

            <h2>
                🛒 My Shopping Cart
            </h2>

            <p>
                Select the flowers you want to order.
            </p>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="message success-message"
        >
        </div>


        <!-- ERROR MESSAGE -->

        <div
            id="errorMessage"
            class="message error-message"
        >
        </div>


        <!-- CART BOX -->

        <div class="cart-box">


            <!-- CART HEADER -->

            <div class="cart-header">

                <h3>
                    🌷 Your Flowers
                </h3>

                <span
                    class="cart-count"
                    id="cartCount"
                >
                    0 Items
                </span>

            </div>


            <!-- CART ITEMS -->

            <div id="cartItems">

                <div class="loading">

                    🌸 Loading your flowers...

                </div>

            </div>


            <!-- BOTTOM SUMMARY -->

            <div
                class="cart-bottom"
                id="cartBottom"
                style="display: none;"
            >

                <div class="summary-row">

                    <span class="summary-label">

                        Selected Total

                    </span>


                    <span class="summary-value">

                        ₹<span id="cartTotal">
                            0.00
                        </span>

                    </span>

                </div>


                <div class="selected-info">

                    <strong id="selectedCount">
                        0
                    </strong>

                    flower(s) selected for checkout.

                </div>


                <!-- BUTTONS -->

                <div class="button-row">


                    <a
                        href="{{ url_for('flowers_page') }}"
                        class="btn btn-secondary"
                    >

                        🌸 Continue Shopping

                    </a>


                    <button
                        type="button"
                        id="checkoutButton"
                        class="btn btn-primary"
                        disabled
                    >

                        💳 Proceed to Checkout

                    </button>

                </div>

            </div>


        </div>

    </div>

</section>


<script>


/* =========================================================
   API
========================================================= */

const API_URL =
    window.location.origin;


/* =========================================================
   VARIABLES
========================================================= */

let cart = [];

let selectedCartIds = [];


/* =========================================================
   GET CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem(
            "currentUser"
        );


    if (!userData) {

        return null;

    }


    try {

        return JSON.parse(
            userData
        );

    } catch (error) {

        console.error(
            "User data error:",
            error
        );

        return null;

    }

}


/* =========================================================
   GET SAVED SELECTED IDS
========================================================= */

function getSavedSelectedIds() {

    const stored =
        sessionStorage.getItem(
            "selectedCartIds"
        );


    if (!stored) {

        return [];

    }


    try {

        const ids =
            JSON.parse(stored);


        if (!Array.isArray(ids)) {

            return [];

        }


        return ids
            .map(Number)
            .filter(
                id =>
                    Number.isFinite(id)
            );


    } catch (error) {

        console.error(
            "Selected IDs error:",
            error
        );

        return [];

    }

}


/* =========================================================
   SAVE SELECTED IDS
========================================================= */

function saveSelectedIds() {

    sessionStorage.setItem(
        "selectedCartIds",
        JSON.stringify(
            selectedCartIds
        )
    );

}


/* =========================================================
   SHOW SUCCESS
========================================================= */

function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.textContent =
        "✓ " + message;


    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        3000
    );

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );


    box.textContent =
        "❌ " + message;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE ERROR
========================================================= */

function hideError() {

    document.getElementById(
        "errorMessage"
    ).style.display =
        "none";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   IMAGE FALLBACK
========================================================= */

function safeImage(image) {

    if (!image) {

        return "";

    }


    return String(image);

}


/* =========================================================
   LOAD CART
========================================================= */

async function loadCart() {

    const container =
        document.getElementById(
            "cartItems"
        );


    const user =
        getCurrentUser();


    /* -----------------------------------------------------
       LOGIN CHECK
    ----------------------------------------------------- */

    if (
        !user ||
        !user.id
    ) {

        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🔐
                </div>

                <h2>
                    Please Login
                </h2>

                <p>
                    Please login to view your shopping cart.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="btn btn-primary"
                >
                    Login
                </a>

            </div>

        `;


        document.getElementById(
            "cartBottom"
        ).style.display =
            "none";


        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart."
            );

        }


        cart =
            Array.isArray(data.cart)
                ? data.cart
                : [];


        /* -------------------------------------------------
           LOAD PREVIOUS SELECTION
        ------------------------------------------------- */

        const savedIds =
            getSavedSelectedIds();


        /*
         * Keep only IDs that still exist
         * in the current cart.
         */

        selectedCartIds =
            savedIds.filter(
                function(id) {

                    return cart.some(
                        function(item) {

                            return (
                                Number(item.id) === id &&
                                !isOrdered(item)
                            );

                        }
                    );

                }
            );


        saveSelectedIds();


        displayCart();


    } catch (error) {

        console.error(
            "Cart loading error:",
            error
        );


        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    ❌
                </div>

                <h2>
                    Unable to Load Cart
                </h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="loadCart()"
                >
                    🔄 Try Again
                </button>

            </div>

        `;


        document.getElementById(
            "cartBottom"
        ).style.display =
            "none";

    }

}


/* =========================================================
   CHECK WHETHER ITEM IS ORDERED
========================================================= */

function isOrdered(item) {

    /*
     * Support backend ordered/status fields
     * if available.
     */

    const status =
        String(
            item.status ||
            item.order_status ||
            ""
        ).toLowerCase();


    if (
        status === "ordered" ||
        status === "completed" ||
        status === "delivered"
    ) {

        return true;

    }


    /*
     * Also check localStorage.
     */

    const orderedIds =
        getOrderedIds();


    return orderedIds.includes(
        Number(item.id)
    );

}


/* =========================================================
   GET ORDERED IDS
========================================================= */

function getOrderedIds() {

    try {

        const stored =
            localStorage.getItem(
                "orderedCartIds"
            );


        if (!stored) {

            return [];

        }


        const ids =
            JSON.parse(stored);


        if (!Array.isArray(ids)) {

            return [];

        }


        return ids
            .map(Number)
            .filter(
                id =>
                    Number.isFinite(id)
            );


    } catch (error) {

        return [];

    }

}


/* =========================================================
   DISPLAY CART
========================================================= */

function displayCart() {

    const container =
        document.getElementById(
            "cartItems"
        );


    document.getElementById(
        "cartCount"
    ).textContent =
        `${cart.length} ${
            cart.length === 1
                ? "Item"
                : "Items"
        }`;


    /* -----------------------------------------------------
       EMPTY CART
    ----------------------------------------------------- */

    if (
        cart.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-cart-icon">
                    🌸
                </div>

                <h2>
                    Your Cart Is Empty
                </h2>

                <p>
                    Add some beautiful flowers to your cart.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="btn btn-primary"
                >
                    🌷 Browse Flowers
                </a>

            </div>

        `;


        document.getElementById(
            "cartBottom"
        ).style.display =
            "none";


        return;

    }


    document.getElementById(
        "cartBottom"
    ).style.display =
        "block";


    container.innerHTML = "";


    /* -----------------------------------------------------
       CREATE EACH ITEM
    ----------------------------------------------------- */

    cart.forEach(
        function(item) {

            const itemId =
                Number(item.id);


            const ordered =
                isOrdered(item);


            const selected =
                selectedCartIds.includes(
                    itemId
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "cart-item";


            if (selected) {

                card.classList.add(
                    "selected"
                );

            }


            if (ordered) {

                card.classList.add(
                    "ordered-item"
                );

            }


            const quantity =
                Math.max(
                    1,
                    Number(
                        item.quantity
                    ) || 1
                );


            const price =
                Number(
                    item.price
                ) || 0;


            const subtotal =
                Number(
                    item.subtotal
                ) ||
                price * quantity;


            card.innerHTML = `

                <!-- CHECKBOX -->

                <div class="select-area">

                    <input
                        type="checkbox"
                        class="select-checkbox"
                        data-id="${itemId}"
                        ${
                            selected
                                ? "checked"
                                : ""
                        }
                        ${
                            ordered
                                ? "disabled"
                                : ""
                        }
                        aria-label="Select ${
                            escapeHtml(
                                item.name
                            )
                        }"
                    >

                </div>


                <!-- IMAGE -->

                <img
                    class="cart-image"
                    src="${safeImage(
                        item.image
                    )}"
                    alt="${escapeHtml(
                        item.name
                    )}"
                    onerror="
                        this.style.display='none';
                    "
                >


                <!-- INFO -->

                <div class="cart-item-info">

                    <h4>
                        🌸
                        ${escapeHtml(
                            item.name ||
                            "Flower"
                        )}
                    </h4>


                    <p>

                        Price:
                        <span class="price-text">

                            ₹${price.toFixed(2)}

                        </span>

                    </p>


                    <p>

                        Quantity:
                        ${quantity}

                    </p>


                    ${
                        ordered
                            ? `
                                <span
                                    class="ordered-badge"
                                >
                                    ✓ Ordered
                                </span>

                                <p class="ordered-note">
                                    This flower has already been ordered.
                                </p>
                              `
                            : ""
                    }

                </div>


                <!-- QUANTITY -->

                <div class="quantity-box">

                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="
                            changeQuantity(
                                ${itemId},
                                -1
                            )
                        "
                        ${
                            ordered
                                ? "disabled"
                                : ""
                        }
                    >
                        −
                    </button>


                    <span class="quantity-value">

                        ${quantity}

                    </span>


                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="
                            changeQuantity(
                                ${itemId},
                                1
                            )
                        "
                        ${
                            ordered
                                ? "disabled"
                                : ""
                        }
                    >
                        +
                    </button>

                </div>


                <!-- SUBTOTAL -->

                <div class="item-subtotal">

                    ₹${subtotal.toFixed(2)}

                </div>


                <!-- REMOVE -->

                <button
                    type="button"
                    class="remove-btn"
                    onclick="
                        removeCartItem(
                            ${itemId}
                        )
                    "
                >

                    🗑 Remove

                </button>

            `;


            container.appendChild(
                card
            );


            /* -------------------------------------------------
               CHECKBOX EVENT
            ------------------------------------------------- */

            const checkbox =
                card.querySelector(
                    ".select-checkbox"
                );


            if (checkbox) {

                checkbox.addEventListener(
                    "change",
                    function() {

                        toggleSelection(
                            itemId,
                            checkbox.checked,
                            card
                        );

                    }
                );

            }

        }
    );


    updateSummary();

}


/* =========================================================
   TOGGLE SELECTION
========================================================= */

function toggleSelection(
    itemId,
    checked,
    card
) {

    itemId =
        Number(itemId);


    if (checked) {

        if (
            !selectedCartIds.includes(
                itemId
            )
        ) {

            selectedCartIds.push(
                itemId
            );

        }


        if (card) {

            card.classList.add(
                "selected"
            );

        }

    } else {

        selectedCartIds =
            selectedCartIds.filter(
                function(id) {

                    return id !== itemId;

                }
            );


        if (card) {

            card.classList.remove(
                "selected"
            );

        }

    }


    saveSelectedIds();


    updateSummary();

}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary() {

    let selectedTotal = 0;

    let selectedCount = 0;


    cart.forEach(
        function(item) {

            const itemId =
                Number(item.id);


            if (
                selectedCartIds.includes(
                    itemId
                ) &&
                !isOrdered(item)
            ) {

                const subtotal =
                    Number(
                        item.subtotal
                    );


                selectedTotal +=
                    Number.isFinite(
                        subtotal
                    )
                        ? subtotal
                        : (
                            Number(item.price) *
                            Number(item.quantity)
                        );


                selectedCount++;

            }

        }
    );


    document.getElementById(
        "cartTotal"
    ).textContent =
        selectedTotal.toFixed(2);


    document.getElementById(
        "selectedCount"
    ).textContent =
        selectedCount;


    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    checkoutButton.disabled =
        selectedCount === 0;


    if (
        selectedCount === 0
    ) {

        checkoutButton.textContent =
            "💳 Select Flowers First";

    } else {

        checkoutButton.textContent =
            `💳 Checkout (${selectedCount})`;

    }

}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

async function changeQuantity(
    itemId,
    change
) {

    hideError();


    const user =
        getCurrentUser();


    if (
        !user ||
        !user.id
    ) {

        showError(
            "Please login first."
        );

        return;

    }


    const item =
        cart.find(
            function(product) {

                return Number(
                    product.id
                ) === Number(itemId);

            }
        );


    if (!item) {

        showError(
            "Cart item not found."
        );

        return;

    }


    if (isOrdered(item)) {

        showError(
            "Ordered items cannot be changed."
        );

        return;

    }


    const currentQuantity =
        Math.max(
            1,
            Number(
                item.quantity
            ) || 1
        );


    const newQuantity =
        currentQuantity +
        Number(change);


    if (
        newQuantity < 1
    ) {

        return;

    }


    try {

        /*
         * IMPORTANT:
         * This expects the backend API:
         *
         * PUT /api/cart/<cart_id>
         *
         * with:
         * { quantity: newQuantity }
         */

        const response =
            await fetch(
                `${API_URL}/api/cart/${itemId}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            quantity:
                                newQuantity

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to update quantity."
            );

        }


        await loadCart();


        showSuccess(
            "Quantity updated successfully."
        );


    } catch (error) {

        console.error(
            "Quantity update error:",
            error
        );


        showError(
            error.message ||
            "Unable to update quantity."
        );

    }

}


/* =========================================================
   REMOVE CART ITEM
========================================================= */

async function removeCartItem(
    itemId
) {

    hideError();


    const user =
        getCurrentUser();


    if (
        !user ||
        !user.id
    ) {

        showError(
            "Please login first."
        );

        return;

    }


    const item =
        cart.find(
            function(product) {

                return Number(
                    product.id
                ) === Number(itemId);

            }
        );


    if (!item) {

        showError(
            "Cart item not found."
        );

        return;

    }


    const confirmed =
        confirm(
            `Are you sure you want to remove "${item.name}" from your cart?`
        );


    if (!confirmed) {

        return;

    }


    try {

        /*
         * Expected backend:
         *
         * DELETE /api/cart/<cart_id>
         */

        const response =
            await fetch(
                `${API_URL}/api/cart/${itemId}`,
                {

                    method:
                        "DELETE"

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to remove item."
            );

        }


        /* -------------------------------------------------
           REMOVE FROM SELECTED IDS
        ------------------------------------------------- */

        selectedCartIds =
            selectedCartIds.filter(
                function(id) {

                    return (
                        id !==
                        Number(itemId)
                    );

                }
            );


        saveSelectedIds();


        await loadCart();


        showSuccess(
            "Flower removed from cart."
        );


    } catch (error) {

        console.error(
            "Remove cart error:",
            error
        );


        showError(
            error.message ||
            "Unable to remove item."
        );

    }

}


/* =========================================================
   CHECKOUT
========================================================= */

document
    .getElementById(
        "checkoutButton"
    )
    .addEventListener(
        "click",
        function() {

            hideError();


            /*
             * Remove invalid / ordered IDs
             */

            selectedCartIds =
                selectedCartIds.filter(
                    function(id) {

                        return cart.some(
                            function(item) {

                                return (
                                    Number(item.id) ===
                                        Number(id) &&
                                    !isOrdered(item)
                                );

                            }
                        );

                    }
                );


            saveSelectedIds();


            if (
                selectedCartIds.length === 0
            ) {

                showError(
                    "Please select at least one flower."
                );

                return;

            }


            /*
             * Checkout page reads:
             *
             * sessionStorage:
             * selectedCartIds
             */

            window.location.href =
                "{{ url_for('checkout_page') }}";

        }
    );


/* =========================================================
   CART UPDATE EVENT
========================================================= */

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key ===
            "cartUpdated"
        ) {

            loadCart();

        }

    }
);


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCart();

    }
);


</script>
