<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff5f8;
            color: #333;
            min-height: 100vh;
        }

        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {
            background: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #d63384;
            font-size: 25px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #444;
            font-weight: 600;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #d63384;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .checkout-section {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .page-title {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .page-title h2 {
            color: #c2185b;
            margin-bottom: 7px;
        }

        .page-title p {
            color: #777;
        }

        /* =====================================================
           CHECKOUT GRID
        ===================================================== */

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 25px;
        }

        .checkout-card {
            background: white;
            border-radius: 16px;
            padding: 25px;

            box-shadow:
                0 6px 25px rgba(0, 0, 0, 0.08);
        }

        .checkout-card h3 {
            color: #c2185b;
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;

            border: 1px solid #e4cbd5;
            border-radius: 8px;

            outline: none;
            font-size: 15px;
            background: #fffafb;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #d63384;

            box-shadow:
                0 0 0 3px rgba(214, 51, 132, 0.08);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* =====================================================
           ORDER ITEMS
        ===================================================== */

        .order-items {
            border: 1px solid #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
            padding: 15px;

            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-name {
            color: #555;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-info {
            color: #777;
            font-size: 14px;
        }

        .item-price {
            color: #d63384;
            font-weight: bold;
            white-space: nowrap;
        }

        /* =====================================================
           TOTAL
        ===================================================== */

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 12px 0;
            border-bottom: 1px solid #eee;

            color: #555;
        }

        .summary-row.total {
            border-bottom: none;
            padding-top: 18px;

            font-size: 22px;
            font-weight: bold;

            color: #c2185b;
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .place-order-btn {
            width: 100%;
            border: none;

            background: #d63384;
            color: white;

            padding: 14px 20px;
            border-radius: 9px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;

            margin-top: 20px;

            transition: 0.2s;
        }

        .place-order-btn:hover {
            background: #c2185b;
        }

        .place-order-btn:disabled {
            background: #d9a2b8;
            cursor: not-allowed;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;

            color: #c2185b;
            font-weight: bold;

            margin-bottom: 20px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message-box {
            background: white;
            text-align: center;

            padding: 50px 25px;
            border-radius: 16px;

            box-shadow:
                0 6px 25px rgba(0, 0, 0, 0.08);
        }

        .message-box h2 {
            color: #d63384;
            margin-bottom: 10px;
        }

        .message-box p {
            color: #777;
            margin-bottom: 20px;
        }

        .shop-btn {
            display: inline-block;

            text-decoration: none;

            background: #d63384;
            color: white;

            padding: 12px 20px;
            border-radius: 8px;

            font-weight: bold;
        }

        .error-message,
        .success-message {
            display: none;

            padding: 12px;
            border-radius: 8px;

            margin-bottom: 18px;
            font-weight: bold;
        }

        .error-message {
            background: #ffe5ec;
            color: #c2185b;
            border: 1px solid #f5b7c9;
        }

        .success-message {
            background: #e8f8ee;
            color: #237a45;
            border: 1px solid #b9e5c8;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 450px) {

            .checkout-section {
                margin-top: 25px;
            }

            .checkout-card {
                padding: 18px;
            }

            .order-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-price {
                align-self: flex-end;
            }
        }

    </style>

</head>

<body>

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>

    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>

            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>

            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<section class="checkout-section">

    <a
        href="{{ url_for('cart_page') }}"
        class="back-btn"
    >
        ← Back to Cart
    </a>


    <div class="page-title">

        <h2>
            🛒 Checkout
        </h2>

        <p>
            Enter your delivery details and place your order.
        </p>

    </div>


    <div id="checkoutContent">

        <div class="checkout-grid">

            <!-- =================================================
                 CUSTOMER DETAILS
            ================================================= -->

            <div class="checkout-card">

                <h3>
                    📋 Delivery Details
                </h3>

                <div
                    id="errorMessage"
                    class="error-message"
                ></div>

                <div
                    id="successMessage"
                    class="success-message"
                ></div>


                <form id="checkoutForm">

                    <div class="form-group">

                        <label for="customerName">
                            Customer Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="address">
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            placeholder="Enter complete delivery address"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="payment">
                            Payment Method
                        </label>

                        <select
                            id="payment"
                            required
                        >

                            <option value="">
                                Select Payment Method
                            </option>

                            <option value="Cash on Delivery">
                                Cash on Delivery
                            </option>

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="Card">
                                Credit / Debit Card
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        id="placeOrderBtn"
                        class="place-order-btn"
                    >
                        🌸 Place Order
                    </button>

                </form>

            </div>


            <!-- =================================================
                 ORDER SUMMARY
            ================================================= -->

            <div class="checkout-card">

                <h3>
                    📦 Order Summary
                </h3>

                <div
                    id="orderItems"
                    class="order-items"
                >

                    <div class="order-item">

                        <div>
                            Loading cart...
                        </div>

                    </div>

                </div>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <strong id="itemCount">
                        0
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span id="orderTotal">
                        ₹0.00
                    </span>

                </div>

            </div>

        </div>

    </div>

</section>


<script>

const API_URL = "";

let selectedCartIds = [];


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem("currentUser");

    if (!userData) {
        return null;
    }

    try {

        return JSON.parse(userData);

    } catch (error) {

        console.error(
            "Current User Error:",
            error
        );

        return null;
    }
}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    const errorBox =
        document.getElementById("errorMessage");

    const successBox =
        document.getElementById("successMessage");

    successBox.style.display = "none";

    errorBox.textContent = message;

    errorBox.style.display = "block";
}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess(message) {

    const errorBox =
        document.getElementById("errorMessage");

    const successBox =
        document.getElementById("successMessage");

    errorBox.style.display = "none";

    successBox.textContent = message;

    successBox.style.display = "block";
}


/* =========================================================
   LOAD CHECKOUT
========================================================= */

async function loadCheckout() {

    const user =
        getCurrentUser();

    if (!user || !user.id) {

        document.getElementById(
            "checkoutContent"
        ).innerHTML = `

            <div class="message-box">

                <h2>
                    🌸 Please Login
                </h2>

                <p>
                    Login to continue with checkout.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`,
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart."
            );

        }


        const cart =
            Array.isArray(data.cart)
                ? data.cart
                : [];


        /*
         * Only active/non-ordered
         * cart items.
         */

        const activeItems =
            cart.filter(
                function(item) {

                    const status =
                        String(
                            item.status || ""
                        )
                        .toLowerCase()
                        .trim();

                    return status !== "ordered";

                }
            );


        if (
            activeItems.length === 0
        ) {

            document.getElementById(
                "checkoutContent"
            ).innerHTML = `

                <div class="message-box">

                    <h2>
                        🛒 Your Cart is Empty
                    </h2>

                    <p>
                        Please add flowers to your cart before checkout.
                    </p>

                    <a
                        href="{{ url_for('flowers_page') }}"
                        class="shop-btn"
                    >
                        🌸 Shop Flowers
                    </a>

                </div>

            `;

            return;
        }


        selectedCartIds =
            activeItems.map(
                function(item) {

                    return Number(
                        item.id
                    );

                }
            );


        displayCheckoutItems(
            activeItems
        );


    } catch (error) {

        console.error(
            "Checkout Error:",
            error
        );


        document.getElementById(
            "checkoutContent"
        ).innerHTML = `

            <div class="message-box">

                <h2>
                    ❌ Unable to Load Checkout
                </h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

                <a
                    href="{{ url_for('cart_page') }}"
                    class="shop-btn"
                >
                    ← Back to Cart
                </a>

            </div>

        `;

    }

}


/* =========================================================
   DISPLAY CHECKOUT ITEMS
========================================================= */

function displayCheckoutItems(items) {

    const container =
        document.getElementById(
            "orderItems"
        );

    let html = "";

    let total = 0;

    let quantityCount = 0;


    items.forEach(
        function(item) {

            const price =
                Number(
                    item.price || 0
                );


            const quantity =
                Number(
                    item.quantity || 0
                );


            const subtotal =
                Number(
                    item.subtotal ??
                    (price * quantity)
                );


            total += subtotal;

            quantityCount += quantity;


            html += `

                <div class="order-item">

                    <div>

                        <div class="item-name">

                            🌸
                            ${escapeHtml(
                                item.name ||
                                "Flower"
                            )}

                        </div>

                        <div class="item-info">

                            ${quantity}
                            ×
                            ₹${price.toFixed(2)}

                        </div>

                    </div>


                    <div class="item-price">

                        ₹${subtotal.toFixed(2)}

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML = html;


    document.getElementById(
        "itemCount"
    ).textContent =
        quantityCount;


    document.getElementById(
        "orderTotal"
    ).textContent =
        `₹${total.toFixed(2)}`;

}


/* =========================================================
   PLACE ORDER
========================================================= */

async function placeOrder(event) {

    event.preventDefault();


    const user =
        getCurrentUser();


    if (!user || !user.id) {

        showError(
            "Please login before placing an order."
        );

        return;
    }


    if (
        selectedCartIds.length === 0
    ) {

        showError(
            "No cart items selected for checkout."
        );

        return;
    }


    const customerName =
        document.getElementById(
            "customerName"
        )
        .value
        .trim();


    const phone =
        document.getElementById(
            "phone"
        )
        .value
        .trim();


    const address =
        document.getElementById(
            "address"
        )
        .value
        .trim();


    const payment =
        document.getElementById(
            "payment"
        )
        .value;


    if (
        !customerName ||
        !phone ||
        !address ||
        !payment
    ) {

        showError(
            "Please fill all customer details."
        );

        return;
    }


    if (
        !/^[0-9]{10}$/.test(phone)
    ) {

        showError(
            "Please enter a valid 10-digit phone number."
        );

        return;
    }


    const button =
        document.getElementById(
            "placeOrderBtn"
        );


    button.disabled = true;

    button.textContent =
        "⏳ Placing Order...";


    try {

        const response =
            await fetch(
                `${API_URL}/api/orders`,
                {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({

                        user_id:
                            Number(user.id),

                        customer_name:
                            customerName,

                        phone:
                            phone,

                        address:
                            address,

                        payment:
                            payment,

                        cart_ids:
                            selectedCartIds

                    })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to place order."
            );

        }


        showSuccess(
            "Order placed successfully! 🌸"
        );


        localStorage.removeItem(
            "selectedCartItems"
        );


        setTimeout(
            function() {

                window.location.href =
                    "{{ url_for('orders_page') }}";

            },
            1000
        );


    } catch (error) {

        console.error(
            "Place Order Error:",
            error
        );


        showError(
            error.message ||
            "Unable to place order."
        );


        button.disabled = false;

        button.textContent =
            "🌸 Place Order";

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCheckout();


        const form =
            document.getElementById(
                "checkoutForm"
            );


        if (form) {

            form.addEventListener(
                "submit",
                placeOrder
            );

        }

    }
);

</script>

</body>

</html>
