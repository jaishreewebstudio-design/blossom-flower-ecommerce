<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders | Blossom Flower Shop</title>


    <style>

        * {
            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            background: white;

            padding: 20px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;
        }


        nav ul {

            list-style: none;

            display: flex;

            gap: 25px;
        }


        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;
        }


        nav ul li a:hover {

            color: #d63384;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .orders-section {

            max-width: 1100px;

            margin: 45px auto;

            padding: 0 20px;
        }


        .page-title {

            background: white;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);
        }


        .page-title h2 {

            color: #c2185b;

            margin-bottom: 7px;
        }


        .page-title p {

            color: #777;
        }


        /* =====================================================
           ORDER COUNT
        ===================================================== */

        .order-count {

            margin-top: 15px;

            display: inline-block;

            background: #ffe0eb;

            color: #c2185b;

            padding: 7px 14px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;
        }


        /* =====================================================
           ORDER CARD
        ===================================================== */

        .order-card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            margin-bottom: 22px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);

            border-left:
                5px solid #d63384;
        }


        /* =====================================================
           ORDER HEADER
        ===================================================== */

        .order-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            border-bottom:
                1px solid #eee;

            padding-bottom: 15px;

            margin-bottom: 18px;
        }


        .order-header h3 {

            color: #c2185b;

            font-size: 19px;
        }


        .order-date {

            color: #777;

            font-size: 14px;

            margin-top: 5px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status-btn {

            border: none;

            background: #fff0c2;

            color: #946200;

            padding: 8px 15px;

            border-radius: 20px;

            font-weight: bold;

            white-space: nowrap;
        }


        .status-processing {

            background: #fff0c2;

            color: #946200;
        }


        .status-completed {

            background: #dff6e7;

            color: #237a45;
        }


        .status-cancelled {

            background: #ffe0e0;

            color: #b42323;
        }


        /* =====================================================
           ORDER DETAILS
        ===================================================== */

        .order-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 22px;
        }


        .detail-box {

            background: #fff8fa;

            border:
                1px solid #f5d8e2;

            padding: 13px;

            border-radius: 9px;

            line-height: 1.5;

            word-break: break-word;
        }


        .detail-box strong {

            color: #c2185b;

            display: inline-block;

            margin-bottom: 3px;
        }


        .address-box {

            grid-column:
                1 / -1;
        }


        /* =====================================================
           PRODUCTS
        ===================================================== */

        .products-title {

            color: #c2185b;

            margin-bottom: 12px;

            font-size: 18px;
        }


        .product-list {

            border:
                1px solid #eee;

            border-radius: 10px;

            overflow: hidden;

            margin-bottom: 20px;
        }


        .product-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px;

            border-bottom:
                1px solid #eee;

            gap: 15px;
        }


        .product-item:last-child {

            border-bottom: none;
        }


        .product-left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .flower-icon {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            background: #fff0f5;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-shrink: 0;

            font-size: 20px;
        }


        .product-name {

            font-weight: bold;

            color: #555;

            margin-bottom: 5px;

            word-break: break-word;
        }


        .product-quantity {

            color: #777;

            font-size: 14px;
        }


        .product-price {

            font-weight: bold;

            color: #d63384;

            white-space: nowrap;

            font-size: 16px;
        }


        /* =====================================================
           ORDER FOOTER
        ===================================================== */

        .order-footer {

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid #eee;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .order-total {

            color: #c2185b;

            font-size: 21px;

            font-weight: bold;
        }


        .delete-btn {

            border: none;

            background: #ffe0e8;

            color: #c2185b;

            padding: 10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }


        .delete-btn:hover {

            background: #f8c5d4;
        }


        .delete-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-order {

            background: white;

            text-align: center;

            padding: 60px 25px;

            border-radius: 16px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .empty-order h2 {

            color: #d63384;

            margin-bottom: 10px;
        }


        .empty-order p {

            color: #777;

            margin-bottom: 20px;
        }


        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: bold;

            border: none;

            cursor: pointer;

            transition: 0.2s;
        }


        .shop-btn:hover {

            background: #c2185b;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            color: #777;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error-box {

            text-align: center;

            background: white;

            padding: 40px;

            border-radius: 15px;

            color: #c2185b;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .error-box h2 {

            margin-bottom: 10px;
        }


        .error-box p {

            color: #777;

            margin-bottom: 20px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }


            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            .orders-section {

                margin-top: 25px;
            }


            .order-details {

                grid-template-columns: 1fr;
            }


            .address-box {

                grid-column: auto;
            }


            .product-item {

                align-items: flex-start;
            }


            .product-price {

                font-size: 15px;
            }


            .order-footer {

                flex-direction: column;

                align-items: stretch;
            }


            .delete-btn {

                width: 100%;
            }

        }


        @media (max-width: 450px) {

            .order-card {

                padding: 18px;
            }


            .page-title {

                padding: 20px;
            }


            .product-item {

                flex-direction: column;
            }


            .product-left {

                width: 100%;
            }


            .product-price {

                align-self: flex-end;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>


    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>


            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>


            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>


            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>


            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================================================
     ORDERS
========================================================= -->

<section class="orders-section">


    <div class="page-title">

        <h2>
            📦 Order History
        </h2>


        <p>
            View all your previously placed orders.
        </p>


        <span
            id="orderCount"
            class="order-count"
        >
            Orders: 0
        </span>

    </div>


    <div id="ordersContainer">

        <div class="loading">

            <h3>
                Loading orders...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    </div>


</section>


<script>

/* =========================================================
   API
========================================================= */

const API_URL = "";


/* =========================================================
   GET CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem("currentUser");


    if (!userData) {

        return null;
    }


    try {

        return JSON.parse(
            userData
        );

    } catch (error) {

        console.error(
            "Current User Error:",
            error
        );

        return null;
    }
}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const countElement =
        document.getElementById(
            "orderCount"
        );


    const user =
        getCurrentUser();


    /*
     * User login check
     */

    if (
        !user ||
        !user.id
    ) {

        countElement.textContent =
            "Orders: 0";


        container.innerHTML = `

            <div class="empty-order">

                <h2>
                    🌸 Please Login
                </h2>

                <p>
                    Login to view your order history.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    try {

        /*
         * Existing backend API:
         *
         * GET
         * /api/orders/user/<user_id>
         */

        const response =
            await fetch(
                `${API_URL}/api/orders/user/${user.id}`,
                {
                    method: "GET",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load orders"
            );
        }


        const orders =
            Array.isArray(
                data.orders
            )
                ? data.orders
                : [];


        displayOrders(
            orders
        );


    } catch (error) {

        console.error(
            "Orders Error:",
            error
        );


        countElement.textContent =
            "Orders: 0";


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Orders
                </h2>

                <p>
                    ${escapeHtml(
                        error.message ||
                        "Something went wrong."
                    )}
                </p>

                <button
                    class="shop-btn"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =========================================================
   DISPLAY ORDERS
========================================================= */

function displayOrders(
    orders
) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const countElement =
        document.getElementById(
            "orderCount"
        );


    /*
     * Update count
     */

    countElement.textContent =
        `Orders: ${orders.length}`;


    container.innerHTML = "";


    /*
     * No orders
     */

    if (
        !orders ||
        orders.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-order">

                <h2>
                    📦 No Orders Found
                </h2>

                <p>
                    Your placed orders will appear here.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="shop-btn"
                >
                    🌸 Shop Flowers
                </a>

            </div>

        `;

        return;
    }


    /*
     * Display every order
     */

    orders.forEach(
        function(order) {

            const orderCard =
                createOrderCard(
                    order
                );


            container.appendChild(
                orderCard
            );

        }
    );

}


/* =========================================================
   CREATE ORDER CARD
========================================================= */

function createOrderCard(
    order
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order-card";


    card.setAttribute(
        "data-order-id",
        order.id
    );


    /*
     * Status
     */

    const status =
        order.status ||
        "Processing";


    const statusClass =
        getStatusClass(
            status
        );


    /*
     * Date
     */

    const date =
        formatDate(
            order.created_at
        );


    /*
     * Products HTML
     */

    let productsHTML = "";


    const items =
        Array.isArray(
            order.items
        )
            ? order.items
            : [];


    if (
        items.length > 0
    ) {

        items.forEach(
            function(item) {

                const price =
                    Number(
                        item.price || 0
                    );


                const quantity =
                    Number(
                        item.quantity || 0
                    );


                const subtotal =
                    Number(
                        item.subtotal ||
                        price * quantity
                    );


                productsHTML += `

                    <div class="product-item">

                        <div class="product-left">

                            <div class="flower-icon">
                                🌸
                            </div>

                            <div>

                                <div class="product-name">

                                    ${escapeHtml(
                                        item.name
                                    )}

                                </div>

                                <div class="product-quantity">

                                    Quantity:
                                    ${quantity}

                                    &nbsp; × &nbsp;

                                    ₹${price.toFixed(2)}

                                </div>

                            </div>

                        </div>


                        <div class="product-price">

                            ₹${subtotal.toFixed(2)}

                        </div>

                    </div>

                `;

            }
        );

    } else {

        productsHTML = `

            <div class="product-item">

                <div class="product-name">
                    No product details available.
                </div>

            </div>

        `;

    }


    /*
     * Create complete card
     */

    card.innerHTML = `

        <div class="order-header">

            <div>

                <h3>

                    📦 Order ID:
                    ${escapeHtml(
                        order.id
                    )}

                </h3>

                <div class="order-date">

                    🕒 ${escapeHtml(
                        date
                    )}

                </div>

            </div>


            <span
                class="status-btn ${statusClass}"
            >

                ${escapeHtml(
                    status
                )}

            </span>

        </div>


        <div class="order-details">


            <div class="detail-box">

                <strong>
                    Customer
                </strong>

                <br>

                ${escapeHtml(
                    order.customer_name
                )}

            </div>


            <div class="detail-box">

                <strong>
                    Phone
                </strong>

                <br>

                ${escapeHtml(
                    order.phone
                )}

            </div>


            <div class="detail-box">

                <strong>
                    Payment
                </strong>

                <br>

                ${escapeHtml(
                    order.payment
                )}

            </div>


            <div class="detail-box">

                <strong>
                    User ID
                </strong>

                <br>

                ${escapeHtml(
                    order.user_id
                )}

            </div>


            <div class="detail-box address-box">

                <strong>
                    Delivery Address
                </strong>

                <br>

                ${escapeHtml(
                    order.address
                )}

            </div>


        </div>


        <h3 class="products-title">

            🌸 Ordered Products

        </h3>


        <div class="product-list">

            ${productsHTML}

        </div>


        <div class="order-footer">


            <div class="order-total">

                Total:
                ₹${Number(
                    order.total || 0
                ).toFixed(2)}

            </div>


            <button
                type="button"
                class="delete-btn"
                onclick="deleteOrder(${Number(order.id)})"
            >

                🗑 Delete Order

            </button>


        </div>

    `;


    return card;

}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
) {

    const normalized =
        String(
            status || ""
        )
        .toLowerCase()
        .trim();


    if (
        normalized === "completed" ||
        normalized === "delivered"
    ) {

        return "status-completed";

    }


    if (
        normalized === "cancelled" ||
        normalized === "canceled"
    ) {

        return "status-cancelled";

    }


    return "status-processing";

}


/* =========================================================
   DELETE ORDER
========================================================= */

async function deleteOrder(
    orderId
) {

    /*
     * Confirm before deletion
     */

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmDelete) {

        return;
    }


    /*
     * Find button
     */

    const card =
        document.querySelector(
            `[data-order-id="${orderId}"]`
        );


    const button =
        card
            ? card.querySelector(
                ".delete-btn"
            )
            : null;


    if (button) {

        button.disabled = true;

        button.textContent =
            "⏳ Deleting...";
    }


    try {

        /*
         * Existing backend API:
         *
         * DELETE
         * /api/orders/<order_id>
         */

        const response =
            await fetch(
                `${API_URL}/api/orders/${orderId}`,
                {
                    method: "DELETE",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to delete order"
            );

        }


        /*
         * Success
         */

        alert(
            "Order deleted successfully. 🌸"
        );


        /*
         * Reload order list
         */

        await loadOrders();


    } catch (error) {

        console.error(
            "Delete Order Error:",
            error
        );


        alert(
            error.message ||
            "Unable to delete order."
        );


        if (button) {

            button.disabled = false;

            button.textContent =
                "🗑 Delete Order";

        }

    }

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "-";
    }


    let date;


    try {

        /*
         * SQLite usually returns:
         *
         * YYYY-MM-DD HH:MM:SS
         *
         * Convert it to ISO-like format.
         */

        const normalized =
            String(
                dateString
            ).replace(
                " ",
                "T"
            );


        date =
            new Date(
                normalized
            );

    } catch (error) {

        return String(
            dateString
        );

    }


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return String(
            dateString
        );

    }


    return date.toLocaleString(
        "en-IN",
        {

            day:
                "2-digit",

            month:
                "short",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadOrders();

    }
);

</script>


</body>

</html>
