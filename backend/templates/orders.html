<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            background: white;

            padding: 18px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;

            white-space: nowrap;
        }


        nav ul {

            list-style: none;

            display: flex;

            align-items: center;

            gap: 25px;
        }


        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;
        }


        nav ul li a:hover {

            color: #d63384;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .orders-section {

            max-width: 1100px;

            margin: 45px auto;

            padding: 0 20px;
        }


        .orders-header {

            margin-bottom: 25px;
        }


        .page-title {

            color: #c2185b;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .page-subtitle {

            color: #777;

            font-size: 15px;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 13px 16px;

            border-radius: 9px;

            margin-bottom: 20px;

            font-weight: bold;
        }


        .message.error {

            display: block;

            background: #ffe7e7;

            color: #b42323;

            border:
                1px solid #f2b8b8;
        }


        /* =====================================================
           ORDERS CONTAINER
        ===================================================== */

        .orders-container {

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        /* =====================================================
           ORDER CARD
        ===================================================== */

        .order-card {

            background: white;

            border-radius: 16px;

            padding: 24px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.07);

            border:
                1px solid #f4dce5;
        }


        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding-bottom: 18px;

            border-bottom:
                1px solid #eeeeee;
        }


        .order-number {

            color: #c2185b;

            font-size: 20px;

            font-weight: bold;
        }


        .order-date {

            color: #777;

            font-size: 14px;

            margin-top: 5px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            padding: 8px 15px;

            border-radius: 30px;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;
        }


        .status.pending {

            background: #fff3cd;

            color: #856404;
        }


        .status.confirmed {

            background: #e7f1ff;

            color: #1557a0;
        }


        .status.processing {

            background: #f0e7ff;

            color: #6332a5;
        }


        .status.shipped {

            background: #e5f7ff;

            color: #08718f;
        }


        .status.delivered {

            background: #e6f8ed;

            color: #16803c;
        }


        .status.cancelled {

            background: #ffe7e7;

            color: #b42323;
        }


        .status.default {

            background: #eeeeee;

            color: #555;
        }


        /* =====================================================
           CUSTOMER DETAILS
        ===================================================== */

        .details-title {

            color: #c2185b;

            font-size: 17px;

            margin-bottom: 15px;
        }


        .customer-details {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px 25px;

            padding: 20px 0;

            border-bottom:
                1px solid #eeeeee;
        }


        .detail {

            font-size: 14px;

            color: #666;

            line-height: 1.5;
        }


        .detail strong {

            color: #444;
        }


        /* =====================================================
           ITEMS
        ===================================================== */

        .items-section {

            padding-top: 20px;
        }


        .items-title {

            color: #c2185b;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .item-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 13px 15px;

            background: #fff9fb;

            border:
                1px solid #f4dce5;

            border-radius: 9px;

            margin-bottom: 8px;
        }


        .item-name {

            font-weight: bold;

            color: #444;
        }


        .item-info {

            color: #777;

            font-size: 13px;

            margin-top: 4px;
        }


        .item-price {

            color: #d63384;

            font-weight: bold;

            white-space: nowrap;
        }


        /* =====================================================
           ORDER TOTAL
        ===================================================== */

        .order-total {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 18px;

            padding-top: 18px;

            border-top:
                1px solid #eeeeee;
        }


        .order-total-label {

            color: #c2185b;

            font-size: 19px;

            font-weight: bold;
        }


        .order-total-price {

            color: #d63384;

            font-size: 23px;

            font-weight: bold;
        }


        /* =====================================================
           PAYMENT
        ===================================================== */

        .payment-info {

            margin-top: 12px;

            color: #777;

            font-size: 14px;
        }


        .payment-info strong {

            color: #444;
        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty-box {

            background: white;

            border-radius: 18px;

            padding: 60px 25px;

            text-align: center;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.07);
        }


        .empty-icon {

            font-size: 55px;

            margin-bottom: 15px;
        }


        .empty-box h2 {

            color: #d63384;

            margin-bottom: 10px;
        }


        .empty-box p {

            color: #777;

            margin-bottom: 22px;
        }


        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 13px 22px;

            border-radius: 9px;

            font-weight: bold;

            transition: 0.2s;
        }


        .shop-btn:hover {

            background: #c2185b;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            background: white;

            border-radius: 16px;

            padding: 45px;

            text-align: center;

            color: #777;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.07);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }


            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            .orders-section {

                margin-top: 25px;
            }


            .order-card {

                padding: 18px;
            }


            .order-top {

                flex-direction: column;

                align-items: flex-start;
            }


            .customer-details {

                grid-template-columns: 1fr;
            }


            .item-row {

                align-items: flex-start;
            }


            .order-total {

                gap: 15px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>


    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>


            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>


            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>


            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>


            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================================================
     ORDERS
========================================================= -->

<section class="orders-section">


    <div class="orders-header">

        <h1 class="page-title">
            🌸 My Orders
        </h1>

        <p class="page-subtitle">
            View your flower orders and delivery details.
        </p>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="ordersContainer"
        class="orders-container"
    >

        <div class="loading">
            🌸 Loading your orders...
        </div>

    </div>


</section>


<script>

/* =========================================================
   API
========================================================= */

const API_URL = "";


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem(
            "currentUser"
        );


    if (!userData) {

        return null;
    }


    try {

        return JSON.parse(
            userData
        );

    } catch (error) {

        console.error(
            "User Error:",
            error
        );

        return null;
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        `message ${type}`;
}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {

    const user =
        getCurrentUser();


    if (!user || !user.id) {

        showMessage(
            "Please login to view your orders.",
            "error"
        );


        document.getElementById(
            "ordersContainer"
        ).innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    🔐
                </div>

                <h2>
                    Please Login
                </h2>

                <p>
                    You need to login before viewing your orders.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    try {

        /*
         * Expected API:
         *
         * GET /api/orders/<user_id>
         */

        const response =
            await fetch(
                `${API_URL}/api/orders/${user.id}`,
                {
                    method: "GET",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load orders."
            );
        }


        let orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        displayOrders(
            orders
        );


    } catch (error) {

        console.error(
            "Orders Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to load orders.",
            "error"
        );


        document.getElementById(
            "ordersContainer"
        ).innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h2>
                    Unable to Load Orders
                </h2>

                <p>
                    Please try again later.
                </p>

                <button
                    class="shop-btn"
                    onclick="loadOrders()"
                    style="border:none;cursor:pointer;"
                >
                    Try Again
                </button>

            </div>

        `;
    }
}


/* =========================================================
   DISPLAY ORDERS
========================================================= */

function displayOrders(
    orders
) {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML = "";


    if (
        !orders ||
        orders.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    🌸
                </div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    You haven't placed any flower orders yet.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="shop-btn"
                >
                    🌸 Shop Flowers
                </a>

            </div>

        `;

        return;
    }


    orders.forEach(
        order => {

            const card =
                createOrderCard(
                    order
                );


            container.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   CREATE ORDER CARD
========================================================= */

function createOrderCard(
    order
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "order-card";


    const orderId =
        order.id ??
        order.order_id ??
        "-";


    const status =
        order.status ||
        "Pending";


    const statusClass =
        getStatusClass(
            status
        );


    const orderDate =
        formatDate(
            order.created_at ||
            order.order_date ||
            order.date
        );


    const customerName =
        order.customer_name ||
        order.name ||
        "-";


    const phone =
        order.phone ||
        "-";


    const address =
        order.address ||
        "-";


    const payment =
        order.payment ||
        order.payment_method ||
        "-";


    const total =
        Number(
            order.total ||
            order.total_amount ||
            order.amount ||
            0
        );


    const items =
        getOrderItems(
            order
        );


    card.innerHTML = `

        <div class="order-top">

            <div>

                <div class="order-number">

                    🌸 Order #${escapeHtml(
                        orderId
                    )}

                </div>

                <div class="order-date">

                    ${escapeHtml(
                        orderDate
                    )}

                </div>

            </div>


            <div
                class="status ${statusClass}"
            >

                ${escapeHtml(
                    status
                )}

            </div>

        </div>


        <div class="customer-details">

            <div>

                <div class="details-title">
                    👤 Customer Details
                </div>

                <div class="detail">

                    <strong>
                        Name:
                    </strong>

                    ${escapeHtml(
                        customerName
                    )}

                </div>

            </div>


            <div>

                <div class="details-title">
                    📞 Contact
                </div>

                <div class="detail">

                    <strong>
                        Phone:
                    </strong>

                    ${escapeHtml(
                        phone
                    )}

                </div>

            </div>


            <div>

                <div class="detail">

                    <strong>
                        Address:
                    </strong>

                    ${escapeHtml(
                        address
                    )}

                </div>

            </div>


            <div>

                <div class="detail">

                    <strong>
                        Payment:
                    </strong>

                    ${escapeHtml(
                        payment
                    )}

                </div>

            </div>

        </div>


        <div class="items-section">

            <div class="items-title">

                🌸 Ordered Flowers

            </div>


            <div class="items-list">

                ${createItemsHtml(
                    items
                )}

            </div>


            <div class="order-total">

                <div class="order-total-label">

                    Total

                </div>


                <div class="order-total-price">

                    ₹${total.toFixed(2)}

                </div>

            </div>


            <div class="payment-info">

                <strong>
                    Payment Method:
                </strong>

                ${escapeHtml(
                    payment
                )}

            </div>

        </div>

    `;


    return card;
}


/* =========================================================
   GET ORDER ITEMS
========================================================= */

function getOrderItems(
    order
) {

    if (
        Array.isArray(
            order.items
        )
    ) {

        return order.items;
    }


    if (
        Array.isArray(
            order.products
        )
    ) {

        return order.products;
    }


    if (
        Array.isArray(
            order.order_items
        )
    ) {

        return order.order_items;
    }


    /*
     * If backend sends one flower
     * directly with the order.
     */

    if (
        order.flower_name ||
        order.product_name ||
        order.name
    ) {

        return [
            {
                name:
                    order.flower_name ||
                    order.product_name ||
                    order.name,

                quantity:
                    order.quantity || 1,

                price:
                    order.price || 0
            }
        ];
    }


    return [];
}


/* =========================================================
   CREATE ITEMS HTML
========================================================= */

function createItemsHtml(
    items
) {

    if (
        !items ||
        items.length === 0
    ) {

        return `

            <div class="item-row">

                <div>

                    <div class="item-name">
                        🌸 Flower Order
                    </div>

                    <div class="item-info">
                        Order details available
                    </div>

                </div>

            </div>

        `;
    }


    return items.map(
        item => {

            const name =
                item.name ||
                item.flower_name ||
                item.product_name ||
                "Flower";


            const quantity =
                Number(
                    item.quantity || 1
                );


            const price =
                Number(
                    item.price || 0
                );


            const subtotal =
                Number(
                    item.subtotal ||
                    (price * quantity)
                );


            return `

                <div class="item-row">

                    <div>

                        <div class="item-name">

                            🌸
                            ${escapeHtml(
                                name
                            )}

                        </div>

                        <div class="item-info">

                            Quantity:
                            ${quantity}

                            ×

                            ₹${price.toFixed(2)}

                        </div>

                    </div>


                    <div class="item-price">

                        ₹${subtotal.toFixed(2)}

                    </div>

                </div>

            `;

        }
    ).join("");
}


/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
) {

    const value =
        String(
            status || ""
        ).toLowerCase();


    if (
        value.includes("pending")
    ) {

        return "pending";
    }


    if (
        value.includes("confirm")
    ) {

        return "confirmed";
    }


    if (
        value.includes("process")
    ) {

        return "processing";
    }


    if (
        value.includes("ship")
    ) {

        return "shipped";
    }


    if (
        value.includes("deliver")
    ) {

        return "delivered";
    }


    if (
        value.includes("cancel")
    ) {

        return "cancelled";
    }


    return "default";
}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
) {

    if (!value) {

        return "Date not available";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);
    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",

            month: "short",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit",

            hour12: true
        }
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadOrders();

    }
);

</script>


</body>

</html>
