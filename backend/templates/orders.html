<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #c5a9b7,
                    #c9a6b5,
                    #e0a7bf
                );

            min-height: 100vh;

            color: #333;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            background: #ffffff;

            border-bottom:
                1px solid #eadde2;

            padding:
                18px 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 100;
        }

        .logo {

            color: #c2185b;

            text-decoration: none;

            font-size: 25px;

            font-weight: 700;
        }

        .header-actions {

            display: flex;

            gap: 10px;

            align-items: center;
        }

        .header-btn {

            text-decoration: none;

            padding:
                9px 17px;

            border-radius: 8px;

            font-weight: 600;

            border:
                1px solid #c2185b;

            color: #c2185b;

            transition: 0.2s;
        }

        .header-btn:hover {

            background: #c2185b;

            color: white;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .container {

            width: 90%;

            max-width: 1100px;

            margin:
                35px auto 60px;
        }

        .page-title {

            text-align: center;

            font-size: 34px;

            color: #000000;

            margin-bottom: 8px;
        }

        .page-subtitle {

            text-align: center;

            color: #0f0e0e;

            margin-bottom: 30px;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 13px 15px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-weight: 600;

            text-align: center;
        }

        .message.success {

            display: block;

            background: #e8f7ed;

            border:
                1px solid #bde5ca;

            color: #187a3d;
        }

        .message.error {

            display: block;

            background: #fff0f0;

            border:
                1px solid #f1c1c1;

            color: #b42318;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            text-align: center;

            padding: 45px;

            color: #777;

            font-size: 16px;
        }

        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            background: #ffffff;

            border:
                1px solid #eadde2;

            border-radius: 15px;

            padding: 55px 20px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(80, 30, 50, 0.07);
        }

        .empty-icon {

            font-size: 50px;

            margin-bottom: 15px;
        }

        .empty h2 {

            color: #9c174b;

            margin-bottom: 10px;
        }

        .empty p {

            color: #777;

            margin-bottom: 20px;
        }

        .shop-btn {

            display: inline-block;

            background: #c2185b;

            color: white;

            text-decoration: none;

            padding:
                11px 20px;

            border-radius: 8px;

            font-weight: 600;
        }

        /* =====================================================
           ORDERS
        ===================================================== */

        .orders-container {

            display: flex;

            flex-direction: column;

            gap: 22px;
        }

        .order-card {

            background: #ffffff;

            border:
                1px solid #eadde2;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(80, 30, 50, 0.08);
        }

        /* =====================================================
           ORDER HEADER
        ===================================================== */

        .order-header {

            background:
                linear-gradient(
                    135deg,
                    #fff1f6,
                    #fff8fa
                );

            border-bottom:
                1px solid #eadde2;

            padding:
                18px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .order-number {

            font-size: 20px;

            font-weight: 700;

            color: #9c174b;
        }

        .order-date {

            color: #777;

            font-size: 14px;

            margin-top: 5px;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display: inline-block;

            padding:
                7px 13px;

            border-radius: 30px;

            font-size: 13px;

            font-weight: 700;

            background: #fff0d8;

            color: #9a5a00;

            white-space: nowrap;
        }

        /* =====================================================
           ORDER BODY
        ===================================================== */

        .order-body {

            padding: 22px;
        }

        .details-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 14px;

            margin-bottom: 22px;
        }

        .detail {

            border:
                1px solid #eee3e7;

            border-radius: 9px;

            padding: 12px;

            background: #fffafd;
        }

        .detail-label {

            display: block;

            color: #888;

            font-size: 12px;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 0.3px;
        }

        .detail-value {

            color: #444;

            font-weight: 600;

            word-break: break-word;
        }

        /* =====================================================
           ITEMS
        ===================================================== */

        .items-title {

            font-size: 18px;

            color: #9c174b;

            margin-bottom: 12px;

            padding-bottom: 10px;

            border-bottom:
                1px solid #eadde2;
        }

        .order-item {

            display: flex;

            align-items: center;

            gap: 15px;

            padding:
                12px 0;

            border-bottom:
                1px solid #f0e7ea;
        }

        .order-item:last-child {

            border-bottom: none;
        }

        .item-image {

            width: 65px;

            height: 65px;

            border-radius: 9px;

            object-fit: cover;

            border:
                1px solid #eee;
        }

        .item-info {

            flex: 1;
        }

        .item-name {

            font-weight: 700;

            color: #444;

            margin-bottom: 5px;
        }

        .item-meta {

            color: #777;

            font-size: 14px;
        }

        .item-subtotal {

            font-weight: 700;

            color: #c2185b;

            white-space: nowrap;
        }

        /* =====================================================
           ORDER FOOTER
        ===================================================== */

        .order-footer {

            border-top:
                1px solid #eadde2;

            margin-top: 15px;

            padding-top: 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }

        .total-label {

            color: #666;

            font-size: 14px;
        }

        .total-amount {

            font-size: 24px;

            font-weight: 700;

            color: #9c174b;

            margin-top: 3px;
        }

        .delete-btn {

            border: none;

            background: #fff0f0;

            color: #b42318;

            border:
                1px solid #efc5c5;

            padding:
                10px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

            transition: 0.2s;
        }

        .delete-btn:hover {

            background: #b42318;

            color: white;
        }

        .delete-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 700px
        ) {

            .header {

                padding:
                    15px 5%;
            }

            .header-actions {

                gap: 5px;
            }

            .header-btn {

                padding:
                    8px 10px;

                font-size: 13px;
            }

            .page-title {

                font-size: 28px;
            }

            .order-header {

                align-items: flex-start;

                flex-direction: column;
            }

            .details-grid {

                grid-template-columns: 1fr;
            }

            .order-footer {

                align-items: flex-start;

                flex-direction: column;
            }

            .delete-btn {

                width: 100%;
            }
        }

        @media (
            max-width: 450px
        ) {

            .container {

                width: 94%;
            }

            .order-body {

                padding: 16px;
            }

            .order-item {

                align-items: flex-start;
            }

            .item-image {

                width: 55px;

                height: 55px;
            }

            .item-subtotal {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <a
        href="/flower"
        class="logo"
    >
        🌸 Blossom Flower Shop
    </a>


    <div class="header-actions">

        <a
            href="/flower"
            class="header-btn"
        >
            Flowers
        </a>


        <a
            href="/cart"
            class="header-btn"
        >
            Cart
        </a>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">

    <h1 class="page-title">
        My Orders
    </h1>

    <p class="page-subtitle">
        View your previous Blossom Flower Shop orders.
    </p>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="loading"
        class="loading"
    >
        Loading your orders...
    </div>


    <div
        id="empty"
        class="empty"
        style="display:none;"
    >

        <div class="empty-icon">
            🌷
        </div>

        <h2>
            No Orders Yet
        </h2>

        <p>
            You haven't placed any orders yet.
        </p>

        <a
            href="/flower"
            class="shop-btn"
        >
            Shop Flowers
        </a>

    </div>


    <div
        id="ordersContainer"
        class="orders-container"
        style="display:none;"
    ></div>

</main>


<script>

    /* =========================================================
       GLOBAL
    ========================================================= */

    let currentUser = null;


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loading =
        document.getElementById(
            "loading"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const ordersContainer =
        document.getElementById(
            "ordersContainer"
        );

    const message =
        document.getElementById(
            "message"
        );


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
        text,
        type
    ) {

        message.textContent =
            text;

        message.className =
            "message " + type;
    }


    /* =========================================================
       FORMAT DATE
    ========================================================= */

    function formatDate(
        dateValue
    ) {

        if (!dateValue) {

            return "N/A";
        }


        const date =
            new Date(
                dateValue.replace(
                    " ",
                    "T"
                ) + "Z"
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return dateValue;
        }


        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",

                month: "short",

                year: "numeric",

                hour: "2-digit",

                minute: "2-digit"
            }
        );
    }


    /* =========================================================
       GET CURRENT USER
    ========================================================= */

    async function getCurrentUser() {

        const response =
            await fetch(
                "/api/me",
                {
                    method: "GET",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.logged_in
        ) {

            throw new Error(
                "Please login to view your orders."
            );
        }


        currentUser =
            data.user;


        return currentUser;
    }


    /* =========================================================
       LOAD ORDERS
    ========================================================= */

    async function loadOrders() {

        loading.style.display =
            "block";

        empty.style.display =
            "none";

        ordersContainer.style.display =
            "none";


        try {

            /* -----------------------------------------------
               STEP 1
               Get logged-in user
            ----------------------------------------------- */

            const user =
                await getCurrentUser();


            /* -----------------------------------------------
               STEP 2
               Get user's orders
            ----------------------------------------------- */

            const response =
                await fetch(
                    "/api/orders",
                    {
                        method: "GET",

                        credentials: "include"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Unable to load orders"
                );
            }


            const orders =
                data.orders || [];


            loading.style.display =
                "none";


            if (
                orders.length === 0
            ) {

                empty.style.display =
                    "block";

                return;
            }


            renderOrders(
                orders
            );


            ordersContainer.style.display =
                "flex";


        } catch (error) {

            loading.style.display =
                "none";


            showMessage(
                error.message,
                "error"
            );
        }
    }


    /* =========================================================
       RENDER ORDERS
    ========================================================= */

    function renderOrders(
        orders
    ) {

        ordersContainer.innerHTML =
            "";


        orders.forEach(
            function(order) {

                const card =
                    createOrderCard(
                        order
                    );


                ordersContainer.appendChild(
                    card
                );

            }
        );
    }


    /* =========================================================
       CREATE ORDER CARD
    ========================================================= */

    function createOrderCard(
        order
    ) {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "order-card";


        /* =================================================
           HEADER
        ================================================= */

        const header =
            document.createElement(
                "div"
            );


        header.className =
            "order-header";


        const titleWrapper =
            document.createElement(
                "div"
            );


        const orderNumber =
            document.createElement(
                "div"
            );


        orderNumber.className =
            "order-number";


        orderNumber.textContent =
            "Order #" +
            order.id;


        const date =
            document.createElement(
                "div"
            );


        date.className =
            "order-date";


        date.textContent =
            formatDate(
                order.created_at
            );


        titleWrapper.appendChild(
            orderNumber
        );

        titleWrapper.appendChild(
            date
        );


        const status =
            document.createElement(
                "span"
            );


        status.className =
            "status";


        status.textContent =
            order.status ||
            "Processing";


        header.appendChild(
            titleWrapper
        );

        header.appendChild(
            status
        );


        /* =================================================
           BODY
        ================================================= */

        const body =
            document.createElement(
                "div"
            );


        body.className =
            "order-body";


        /* =================================================
           CUSTOMER DETAILS
        ================================================= */

        const details =
            document.createElement(
                "div"
            );


        details.className =
            "details-grid";


        details.appendChild(
            createDetail(
                "Customer Name",
                order.customer_name
            )
        );


        details.appendChild(
            createDetail(
                "Phone",
                order.phone
            )
        );


        details.appendChild(
            createDetail(
                "Payment",
                order.payment
            )
        );


        details.appendChild(
            createDetail(
                "Address",
                order.address
            )
        );


        body.appendChild(
            details
        );


        /* =================================================
           ITEMS TITLE
        ================================================= */

        const itemsTitle =
            document.createElement(
                "h3"
            );


        itemsTitle.className =
            "items-title";


        itemsTitle.textContent =
            "Ordered Flowers";


        body.appendChild(
            itemsTitle
        );


        /* =================================================
           ITEMS
        ================================================= */

        const itemsWrapper =
            document.createElement(
                "div"
            );


        const items =
            order.items || [];


        if (
            items.length === 0
        ) {

            const noItems =
                document.createElement(
                    "p"
                );


            noItems.textContent =
                "No order items found.";


            noItems.style.color =
                "#777";


            itemsWrapper.appendChild(
                noItems
            );

        } else {

            items.forEach(
                function(item) {

                    itemsWrapper.appendChild(
                        createOrderItem(
                            item
                        )
                    );

                }
            );
        }


        body.appendChild(
            itemsWrapper
        );


        /* =================================================
           FOOTER
        ================================================= */

        const footer =
            document.createElement(
                "div"
            );


        footer.className =
            "order-footer";


        const totalWrapper =
            document.createElement(
                "div"
            );


        const totalLabel =
            document.createElement(
                "div"
            );


        totalLabel.className =
            "total-label";


        totalLabel.textContent =
            "Order Total";


        const total =
            document.createElement(
                "div"
            );


        total.className =
            "total-amount";


        total.textContent =
            "₹" +
            Number(
                order.total || 0
            ).toFixed(2);


        totalWrapper.appendChild(
            totalLabel
        );

        totalWrapper.appendChild(
            total
        );


        /* =================================================
           DELETE BUTTON
        ================================================= */

        const deleteButton =
            document.createElement(
                "button"
            );


        deleteButton.type =
            "button";


        deleteButton.className =
            "delete-btn";


        deleteButton.textContent =
            "Delete Order";


        deleteButton.addEventListener(
            "click",
            function() {

                deleteOrder(
                    order.id,
                    deleteButton
                );

            }
        );


        footer.appendChild(
            totalWrapper
        );

        footer.appendChild(
            deleteButton
        );


        body.appendChild(
            footer
        );


        card.appendChild(
            header
        );

        card.appendChild(
            body
        );


        return card;
    }


    /* =========================================================
       CREATE DETAIL
    ========================================================= */

    function createDetail(
        label,
        value
    ) {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "detail";


        const labelElement =
            document.createElement(
                "span"
            );


        labelElement.className =
            "detail-label";


        labelElement.textContent =
            label;


        const valueElement =
            document.createElement(
                "div"
            );


        valueElement.className =
            "detail-value";


        valueElement.textContent =
            value || "N/A";


        wrapper.appendChild(
            labelElement
        );

        wrapper.appendChild(
            valueElement
        );


        return wrapper;
    }


    /* =========================================================
       CREATE ORDER ITEM
    ========================================================= */

    function createOrderItem(
        item
    ) {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "order-item";


        const image =
            document.createElement(
                "img"
            );


        image.className =
            "item-image";


        image.src =
            item.image ||
            "https://via.placeholder.com/100x100?text=Flower";


        image.alt =
            item.name ||
            "Flower";


        image.onerror =
            function() {

                this.src =
                    "https://via.placeholder.com/100x100?text=Flower";

            };


        const info =
            document.createElement(
                "div"
            );


        info.className =
            "item-info";


        const name =
            document.createElement(
                "div"
            );


        name.className =
            "item-name";


        name.textContent =
            item.name ||
            "Flower";


        const meta =
            document.createElement(
                "div"
            );


        meta.className =
            "item-meta";


        meta.textContent =
            "₹" +
            Number(
                item.price || 0
            ).toFixed(2) +
            " × " +
            Number(
                item.quantity || 0
            );


        info.appendChild(
            name
        );

        info.appendChild(
            meta
        );


        const subtotal =
            document.createElement(
                "div"
            );


        subtotal.className =
            "item-subtotal";


        subtotal.textContent =
            "₹" +
            Number(
                item.subtotal || 0
            ).toFixed(2);


        wrapper.appendChild(
            image
        );

        wrapper.appendChild(
            info
        );

        wrapper.appendChild(
            subtotal
        );


        return wrapper;
    }


    /* =========================================================
       DELETE ORDER
    ========================================================= */

    async function deleteOrder(
        orderId,
        button
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to delete Order #" +
                orderId +
                "?\n\nThe order will be removed and the flower stock will be restored."
            );


        if (!confirmed) {

            return;
        }


        button.disabled =
            true;

        button.textContent =
            "Deleting...";


        try {

            const response =
                await fetch(
                    "/api/orders/" +
                    encodeURIComponent(
                        orderId
                    ),
                    {
                        method: "DELETE",

                        credentials: "include"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Unable to delete order"
                );
            }


            showMessage(
                data.message ||
                "Order deleted successfully.",
                "success"
            );


            /* Reload orders */
            await loadOrders();


        } catch (error) {

            showMessage(
                error.message,
                "error"
            );


            button.disabled =
                false;

            button.textContent =
                "Delete Order";
        }
    }


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    loadOrders();

</script>


</body>

</html>
