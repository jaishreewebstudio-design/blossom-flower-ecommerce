<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Blossom Flower Shop</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            background: white;

            padding: 20px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;
        }


        nav ul {

            list-style: none;

            display: flex;

            gap: 25px;
        }


        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;
        }


        nav ul li a:hover {

            color: #d63384;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .cart-section {

            max-width: 1150px;

            margin: 45px auto;

            padding: 0 20px;
        }


        .page-title {

            background: white;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);
        }


        .page-title h2 {

            color: #c2185b;

            margin-bottom: 7px;
        }


        .page-title p {

            color: #777;
        }


        /* =====================================================
           CART LAYOUT
        ===================================================== */

        .cart-layout {

            display: grid;

            grid-template-columns:
                1fr 330px;

            gap: 25px;

            align-items: start;
        }


        /* =====================================================
           CART CARD
        ===================================================== */

        .cart-card {

            background: white;

            border-radius: 16px;

            padding: 22px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .cart-card-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding-bottom: 18px;

            margin-bottom: 18px;

            border-bottom:
                1px solid #eee;

            flex-wrap: wrap;
        }


        .cart-card-header h3 {

            color: #c2185b;
        }


        .select-all-box {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #555;

            font-size: 14px;

            font-weight: bold;
        }


        .select-all-box input {

            width: 17px;

            height: 17px;

            accent-color: #d63384;

            cursor: pointer;
        }


        /* =====================================================
           CART ITEM
        ===================================================== */

        .cart-item {

            display: grid;

            grid-template-columns:
                30px
                90px
                1fr
                auto;

            gap: 15px;

            align-items: center;

            padding: 18px 0;

            border-bottom:
                1px solid #eee;
        }


        .cart-item:last-child {

            border-bottom: none;
        }


        .cart-checkbox {

            width: 18px;

            height: 18px;

            accent-color: #d63384;

            cursor: pointer;
        }


        .flower-image {

            width: 90px;

            height: 90px;

            object-fit: cover;

            border-radius: 12px;

            border:
                1px solid #f0d8e1;

            background: #fff5f8;
        }


        .item-info h4 {

            color: #555;

            font-size: 17px;

            margin-bottom: 6px;
        }


        .item-category {

            color: #999;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .item-price {

            color: #d63384;

            font-weight: bold;

            font-size: 16px;
        }


        .quantity-area {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 10px;
        }


        .quantity-btn {

            width: 30px;

            height: 30px;

            border: none;

            border-radius: 7px;

            background: #ffe0e8;

            color: #c2185b;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .quantity-btn:hover {

            background: #f8c5d4;
        }


        .quantity-value {

            min-width: 28px;

            text-align: center;

            font-weight: bold;

            color: #444;
        }


        .item-right {

            text-align: right;

            min-width: 120px;
        }


        .item-subtotal {

            color: #c2185b;

            font-weight: bold;

            font-size: 17px;

            margin-bottom: 10px;
        }


        .remove-btn {

            border: none;

            background: transparent;

            color: #d63384;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;
        }


        .remove-btn:hover {

            text-decoration: underline;
        }


        /* =====================================================
           ORDERED ITEM
        ===================================================== */

        .cart-item.ordered {

            opacity: 0.75;

            background: #fafafa;

            padding-left: 12px;

            padding-right: 12px;

            border-radius: 10px;

            margin-bottom: 10px;

            border:
                1px solid #eee;
        }


        .ordered-badge {

            display: inline-block;

            background: #fff0c2;

            color: #946200;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;

            margin-top: 7px;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary-card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 105px;
        }


        .summary-card h3 {

            color: #c2185b;

            margin-bottom: 20px;

            padding-bottom: 15px;

            border-bottom:
                1px solid #eee;
        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 14px;

            color: #666;
        }


        .summary-row strong {

            color: #444;
        }


        .summary-total {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding-top: 18px;

            margin-top: 15px;

            border-top:
                1px solid #eee;

            color: #c2185b;

            font-size: 21px;

            font-weight: bold;
        }


        .checkout-btn {

            width: 100%;

            border: none;

            background: #d63384;

            color: white;

            padding: 13px 18px;

            border-radius: 9px;

            margin-top: 20px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .checkout-btn:hover {

            background: #c2185b;
        }


        .checkout-btn:disabled {

            background: #ccc;

            cursor: not-allowed;
        }


        .clear-btn {

            width: 100%;

            border: 1px solid #f1b9c9;

            background: #fff5f8;

            color: #c2185b;

            padding: 11px 18px;

            border-radius: 9px;

            margin-top: 10px;

            font-weight: bold;

            cursor: pointer;
        }


        .clear-btn:hover {

            background: #ffe0e8;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-cart {

            background: white;

            text-align: center;

            padding: 65px 25px;

            border-radius: 16px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .empty-cart h2 {

            color: #d63384;

            margin-bottom: 10px;
        }


        .empty-cart p {

            color: #777;

            margin-bottom: 20px;
        }


        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: bold;
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading {

            background: white;

            padding: 45px;

            text-align: center;

            border-radius: 16px;

            color: #777;
        }


        .error-box {

            background: white;

            padding: 45px;

            text-align: center;

            border-radius: 16px;

            color: #c2185b;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 850px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }


            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            .cart-layout {

                grid-template-columns: 1fr;
            }


            .summary-card {

                position: static;
            }
        }


        @media (max-width: 600px) {

            .cart-item {

                grid-template-columns:
                    25px
                    70px
                    1fr;

                gap: 10px;
            }


            .flower-image {

                width: 70px;

                height: 70px;
            }


            .item-right {

                grid-column: 2 / -1;

                text-align: left;

                min-width: auto;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>


    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>

            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>

            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================================================
     CART
========================================================= -->

<section class="cart-section">


    <div class="page-title">

        <h2>
            🛒 My Shopping Cart
        </h2>

        <p>
            Review your flowers before proceeding to checkout.
        </p>

    </div>


    <div id="cartContainer">

        <div class="loading">
            Loading cart...
        </div>

    </div>


</section>


<script>

/* =========================================================
   API
========================================================= */

const API_URL = "";


/* =========================================================
   GET CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem("currentUser");


    if (!userData) {

        return null;
    }


    try {

        return JSON.parse(userData);

    } catch (error) {

        console.error(
            "Current User Error:",
            error
        );

        return null;
    }
}


/* =========================================================
   LOAD CART
========================================================= */

async function loadCart() {

    const container =
        document.getElementById(
            "cartContainer"
        );


    const user =
        getCurrentUser();


    if (!user || !user.id) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>
                    🌸 Please Login
                </h2>

                <p>
                    Login to view your shopping cart.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`,
                {
                    method: "GET",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart"
            );
        }


        displayCart(
            data.cart || []
        );


    } catch (error) {

        console.error(
            "Cart Error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Cart
                </h2>

                <p>
                    ${escapeHtml(
                        error.message ||
                        "Please make sure Flask server is running."
                    )}
                </p>

                <br>

                <button
                    class="shop-btn"
                    onclick="loadCart()"
                >
                    Try Again
                </button>

            </div>

        `;
    }
}


/* =========================================================
   DISPLAY CART
========================================================= */

function displayCart(cart) {

    const container =
        document.getElementById(
            "cartContainer"
        );


    if (
        !cart ||
        cart.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>
                    🛒 Your Cart is Empty
                </h2>

                <p>
                    Add some beautiful flowers to your cart.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="shop-btn"
                >
                    🌸 Shop Flowers
                </a>

            </div>

        `;

        return;
    }


    const activeItems =
        cart.filter(
            function(item) {

                return (
                    item.status !== "Ordered"
                );
            }
        );


    const orderedItems =
        cart.filter(
            function(item) {

                return (
                    item.status === "Ordered"
                );
            }
        );


    let itemsHTML = "";


    activeItems.forEach(
        function(item) {

            itemsHTML += createCartItem(
                item,
                false
            );
        }
    );


    orderedItems.forEach(
        function(item) {

            itemsHTML += createCartItem(
                item,
                true
            );
        }
    );


    const activeTotal =
        activeItems.reduce(
            function(total, item) {

                return (
                    total +
                    Number(
                        item.subtotal || 0
                    )
                );

            },
            0
        );


    container.innerHTML = `

        <div class="cart-layout">


            <div class="cart-card">


                <div class="cart-card-header">

                    <h3>
                        🌸 Cart Items
                    </h3>


                    ${
                        activeItems.length > 0
                        ?
                        `
                        <label class="select-all-box">

                            <input
                                type="checkbox"
                                id="selectAll"
                                onchange="toggleSelectAll(this)"
                            >

                            Select All

                        </label>
                        `
                        :
                        ""
                    }

                </div>


                ${
                    itemsHTML ||
                    `
                    <div class="empty-cart">

                        <h2>
                            🛒 No Active Items
                        </h2>

                        <p>
                            Your cart does not have any items ready for checkout.
                        </p>

                        <a
                            href="{{ url_for('flowers_page') }}"
                            class="shop-btn"
                        >
                            🌸 Shop Flowers
                        </a>

                    </div>
                    `
                }


            </div>


            <div class="summary-card">


                <h3>
                    🧾 Cart Summary
                </h3>


                <div class="summary-row">

                    <span>
                        Active Items
                    </span>

                    <strong id="activeItemsCount">
                        ${activeItems.length}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Selected Items
                    </span>

                    <strong id="selectedItemsCount">
                        0
                    </strong>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="cartTotal">
                        ₹0.00
                    </span>

                </div>


                <button
                    type="button"
                    class="checkout-btn"
                    id="checkoutBtn"
                    onclick="goToCheckout()"
                    disabled
                >
                    Proceed to Checkout
                </button>


                ${
                    activeItems.length > 0
                    ?
                    `
                    <button
                        type="button"
                        class="clear-btn"
                        onclick="clearCart()"
                    >
                        🗑 Clear Active Cart
                    </button>
                    `
                    :
                    ""
                }


            </div>


        </div>

    `;


    updateSummary();
}


/* =========================================================
   CREATE CART ITEM
========================================================= */

function createCartItem(
    item,
    isOrdered
) {

    const image =
        item.image ||
        "https://via.placeholder.com/90x90?text=Flower";


    const subtotal =
        Number(
            item.subtotal || 0
        );


    const price =
        Number(
            item.price || 0
        );


    const quantity =
        Number(
            item.quantity || 1
        );


    if (isOrdered) {

        return `

            <div class="cart-item ordered">


                <div></div>


                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(item.name)}"
                    class="flower-image"
                    onerror="this.src='https://via.placeholder.com/90x90?text=Flower'"
                >


                <div class="item-info">

                    <h4>
                        🌸 ${escapeHtml(item.name)}
                    </h4>

                    <div class="item-category">
                        Previously purchased item
                    </div>

                    <div class="item-price">
                        ₹${price.toFixed(2)}
                    </div>

                    <span class="ordered-badge">
                        ✓ Ordered
                    </span>

                </div>


                <div class="item-right">

                    <div class="item-subtotal">
                        ₹${subtotal.toFixed(2)}
                    </div>

                    <div>
                        Quantity:
                        ${quantity}
                    </div>

                </div>


            </div>

        `;
    }


    return `

        <div
            class="cart-item"
            data-cart-id="${item.id}"
        >


            <input
                type="checkbox"
                class="cart-checkbox item-checkbox"
                data-cart-id="${item.id}"
                data-subtotal="${subtotal}"
                onchange="updateSummary()"
            >


            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(item.name)}"
                class="flower-image"
                onerror="this.src='https://via.placeholder.com/90x90?text=Flower'"
            >


            <div class="item-info">

                <h4>
                    🌸 ${escapeHtml(item.name)}
                </h4>


                <div class="item-category">

                    ${escapeHtml(
                        item.category ||
                        "Fresh Flower"
                    )}

                </div>


                <div class="item-price">

                    ₹${price.toFixed(2)}

                </div>


                <div class="quantity-area">


                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="changeQuantity(
                            ${item.id},
                            ${quantity - 1}
                        )"
                        ${quantity <= 1 ? "disabled" : ""}
                    >
                        −
                    </button>


                    <span class="quantity-value">
                        ${quantity}
                    </span>


                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="changeQuantity(
                            ${item.id},
                            ${quantity + 1}
                        )"
                        ${
                            item.stock &&
                            quantity >= item.stock
                            ?
                            "disabled"
                            :
                            ""
                        }
                    >
                        +
                    </button>


                </div>

            </div>


            <div class="item-right">


                <div class="item-subtotal">

                    ₹${subtotal.toFixed(2)}

                </div>


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeCartItem(${item.id})"
                >
                    🗑 Remove
                </button>


            </div>


        </div>

    `;
}


/* =========================================================
   SELECT ALL
========================================================= */

function toggleSelectAll(
    checkbox
) {

    const checkboxes =
        document.querySelectorAll(
            ".item-checkbox"
        );


    checkboxes.forEach(
        function(item) {

            item.checked =
                checkbox.checked;

        }
    );


    updateSummary();
}


/* =========================================================
   UPDATE SUMMARY
========================================================= */

function updateSummary() {

    const selected =
        document.querySelectorAll(
            ".item-checkbox:checked"
        );


    let total = 0;


    selected.forEach(
        function(checkbox) {

            total += Number(
                checkbox.dataset.subtotal || 0
            );

        }
    );


    const selectedCount =
        document.getElementById(
            "selectedItemsCount"
        );


    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    const checkoutBtn =
        document.getElementById(
            "checkoutBtn"
        );


    if (selectedCount) {

        selectedCount.textContent =
            selected.length;
    }


    if (totalElement) {

        totalElement.textContent =
            `₹${total.toFixed(2)}`;
    }


    if (checkoutBtn) {

        checkoutBtn.disabled =
            selected.length === 0;
    }


    const allCheckboxes =
        document.querySelectorAll(
            ".item-checkbox"
        );


    const selectAll =
        document.getElementById(
            "selectAll"
        );


    if (
        selectAll &&
        allCheckboxes.length > 0
    ) {

        selectAll.checked =
            (
                selected.length ===
                allCheckboxes.length
            );
    }
}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

async function changeQuantity(
    cartId,
    quantity
) {

    if (quantity < 1) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${cartId}`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({

                        quantity:
                            quantity

                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to update quantity"
            );
        }


        await loadCart();


    } catch (error) {

        console.error(
            "Quantity Update Error:",
            error
        );


        alert(
            error.message ||
            "Unable to update quantity."
        );
    }
}


/* =========================================================
   REMOVE CART ITEM
========================================================= */

async function removeCartItem(
    cartId
) {

    const confirmed =
        confirm(
            "Are you sure you want to remove this flower from your cart?"
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${cartId}`,
                {

                    method: "DELETE",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to remove item"
            );
        }


        await loadCart();


    } catch (error) {

        console.error(
            "Remove Cart Error:",
            error
        );


        alert(
            error.message ||
            "Unable to remove item."
        );
    }
}


/* =========================================================
   CLEAR ACTIVE CART
========================================================= */

async function clearCart() {

    const user =
        getCurrentUser();


    if (!user || !user.id) {

        alert(
            "Please login first."
        );

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to clear all active cart items?"
        );


    if (!confirmed) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/user/${user.id}`,
                {

                    method: "DELETE",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to clear cart"
            );
        }


        await loadCart();


    } catch (error) {

        console.error(
            "Clear Cart Error:",
            error
        );


        alert(
            error.message ||
            "Unable to clear cart."
        );
    }
}


/* =========================================================
   GO TO CHECKOUT
========================================================= */

function goToCheckout() {

    const selected =
        document.querySelectorAll(
            ".item-checkbox:checked"
        );


    if (
        !selected ||
        selected.length === 0
    ) {

        alert(
            "Please select at least one flower for checkout."
        );

        return;
    }


    const cartIds = [];


    selected.forEach(
        function(checkbox) {

            cartIds.push(
                Number(
                    checkbox.dataset.cartId
                )
            );

        }
    );


    /*
     * Store selected cart IDs temporarily.
     *
     * checkout.html will read these IDs
     * and load the selected cart items
     * from the backend.
     */

    sessionStorage.setItem(
        "checkoutCartIds",
        JSON.stringify(cartIds)
    );


    window.location.href =
        "{{ url_for('checkout_page') }}";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCart();

    }
);

</script>
