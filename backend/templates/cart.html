<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Blossom Flower Shop</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            background: white;

            padding: 20px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;
        }


        nav ul {

            list-style: none;

            display: flex;

            gap: 25px;
        }


        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;
        }


        nav ul li a:hover {

            color: #d63384;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .cart-section {

            max-width: 1100px;

            margin: 45px auto;

            padding: 0 20px;
        }


        .page-title {

            background: white;

            padding: 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.07);
        }


        .page-title h2 {

            color: #c2185b;

            margin-bottom: 7px;
        }


        .page-title p {

            color: #777;
        }


        /* =====================================================
           CART LAYOUT
        ===================================================== */

        .cart-layout {

            display: grid;

            grid-template-columns:
                1fr 330px;

            gap: 25px;

            align-items: start;
        }


        /* =====================================================
           CART CARD
        ===================================================== */

        .cart-card {

            background: white;

            border-radius: 16px;

            padding: 20px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .cart-item {

            display: flex;

            align-items: center;

            gap: 18px;

            padding: 18px 0;

            border-bottom:
                1px solid #eee;

            transition: 0.2s;
        }


        .cart-item:last-child {

            border-bottom: none;
        }


        .cart-item.selected-item {

            background: #fff7fa;

            border-radius: 12px;

            padding-left: 12px;

            padding-right: 12px;

            margin-bottom: 3px;
        }


        /* =====================================================
           ITEM SELECT CHECKBOX
        ===================================================== */

        .select-area {

            width: 32px;

            min-width: 32px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .item-checkbox {

            width: 21px;

            height: 21px;

            cursor: pointer;

            accent-color: #d63384;
        }


        .item-checkbox:hover {

            transform: scale(1.08);
        }


        .item-checkbox:disabled {

            cursor: not-allowed;

            opacity: 0.5;
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .product-image {

            width: 100px;

            height: 100px;

            object-fit: cover;

            border-radius: 12px;

            border:
                1px solid #f2d4df;

            background: #fff5f8;
        }


        .product-info {

            flex: 1;
        }


        .product-name {

            color: #c2185b;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .product-price {

            color: #555;

            font-size: 15px;

            margin-bottom: 12px;
        }


        .stock-text {

            color: #777;

            font-size: 13px;

            margin-top: 7px;
        }


        /* =====================================================
           QUANTITY
        ===================================================== */

        .quantity-area {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .quantity-btn {

            width: 34px;

            height: 34px;

            border: none;

            border-radius: 7px;

            background: #ffe0e8;

            color: #c2185b;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .quantity-btn:hover {

            background: #f8c5d4;
        }


        .quantity-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        .quantity-number {

            min-width: 35px;

            text-align: center;

            font-weight: bold;

            color: #444;
        }


        /* =====================================================
           ITEM RIGHT SIDE
        ===================================================== */

        .item-right {

            min-width: 130px;

            text-align: right;
        }


        .item-subtotal {

            color: #d63384;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .remove-btn {

            border: none;

            background: #fff0f3;

            color: #c2185b;

            padding: 8px 12px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }


        .remove-btn:hover {

            background: #ffe0e8;
        }


        /* =====================================================
           ORDERED ITEM
        ===================================================== */

        .ordered-label {

            display: inline-block;

            background: #e8f5e9;

            color: #2e7d32;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;

            margin-top: 8px;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary-card {

            background: white;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 100px;
        }


        .summary-card h3 {

            color: #c2185b;

            margin-bottom: 20px;

            font-size: 20px;
        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            padding: 11px 0;

            border-bottom:
                1px solid #eee;

            color: #555;
        }


        .summary-row.total {

            border-bottom: none;

            margin-top: 10px;

            font-size: 21px;

            font-weight: bold;

            color: #c2185b;
        }


        /* =====================================================
           SELECTED SUMMARY
        ===================================================== */

        .selected-summary {

            background: #fff0f5;

            border:
                1px solid #f5c2d5;

            border-radius: 10px;

            padding: 13px;

            margin-top: 15px;

            color: #c2185b;

            font-size: 14px;
        }


        .selected-summary-row {

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .selected-summary-row + .selected-summary-row {

            margin-top: 8px;
        }


        .selected-summary strong {

            color: #a3154e;

            font-size: 15px;
        }


        /* =====================================================
           CHECKOUT BUTTON
        ===================================================== */

        .checkout-btn {

            width: 100%;

            border: none;

            background: #d63384;

            color: white;

            padding: 14px;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 20px;

            transition: 0.3s;
        }


        .checkout-btn:hover {

            background: #c2185b;
        }


        .checkout-btn:disabled {

            background: #ccc;

            color: #777;

            cursor: not-allowed;
        }


        .clear-btn {

            width: 100%;

            border:
                1px solid #d63384;

            background: white;

            color: #c2185b;

            padding: 12px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }


        .clear-btn:hover {

            background: #fff0f3;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty-cart {

            background: white;

            text-align: center;

            padding: 70px 25px;

            border-radius: 16px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .empty-cart h2 {

            color: #d63384;

            margin-bottom: 10px;
        }


        .empty-cart p {

            color: #777;

            margin-bottom: 20px;
        }


        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 12px 20px;

            border-radius: 8px;

            font-weight: bold;
        }


        .shop-btn:hover {

            background: #c2185b;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            text-align: center;

            background: white;

            padding: 50px;

            border-radius: 15px;

            color: #777;
        }


        .error-box {

            text-align: center;

            background: white;

            padding: 50px;

            border-radius: 15px;

            color: #c2185b;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            .cart-layout {

                grid-template-columns: 1fr;
            }


            .summary-card {

                position: static;
            }
        }


        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }


            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            .cart-item {

                flex-wrap: wrap;
            }


            .item-right {

                width: 100%;

                text-align: left;

                padding-left: 50px;
            }


            .product-image {

                width: 80px;

                height: 80px;
            }
        }


        @media (max-width: 450px) {

            .cart-section {

                padding: 0 12px;

                margin-top: 25px;
            }


            .cart-card {

                padding: 12px;
            }


            .cart-item {

                gap: 10px;
            }


            .select-area {

                width: 25px;

                min-width: 25px;
            }


            .product-image {

                width: 70px;

                height: 70px;
            }


            .product-name {

                font-size: 16px;
            }


            .product-price {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>


    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>


            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>


            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>


            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>


            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================================================
     CART SECTION
========================================================= -->

<section class="cart-section">


    <div class="page-title">

        <h2>
            🛒 My Shopping Cart
        </h2>

        <p>
            Select the flowers you want to order.
        </p>

    </div>


    <div id="cartContainer">

        <div class="loading">
            Loading cart...
        </div>

    </div>


</section>


<script>


/* =========================================================
   API
========================================================= */

const API_URL = "";


/* =========================================================
   GET CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem("currentUser");


    if (!userData) {

        return null;
    }


    try {

        return JSON.parse(userData);

    } catch (error) {

        console.error(error);

        return null;
    }
}


/* =========================================================
   LOAD CART
========================================================= */

async function loadCart() {

    const container =
        document.getElementById("cartContainer");


    const user =
        getCurrentUser();


    if (!user || !user.id) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>
                    🌸 Please Login
                </h2>

                <p>
                    Login to view your shopping cart.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`,
                {
                    method: "GET",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart"
            );
        }


        displayCart(data);

    } catch (error) {

        console.error(
            "Cart Error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    ❌ Unable to Load Cart
                </h2>

                <p>
                    Please make sure Flask server is running.
                </p>

                <br>

                <button
                    class="shop-btn"
                    onclick="loadCart()"
                >
                    Try Again
                </button>

            </div>

        `;
    }
}


/* =========================================================
   DISPLAY CART
========================================================= */

function displayCart(data) {

    const container =
        document.getElementById("cartContainer");


    const cart =
        data.cart || [];


    const activeItems =
        cart.filter(
            item =>
                item.status !== "Ordered"
        );


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <h2>
                    🛒 Your Cart is Empty
                </h2>

                <p>
                    Add some beautiful flowers to your cart.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="shop-btn"
                >
                    🌸 Shop Flowers
                </a>

            </div>

        `;

        return;
    }


    let itemsHTML = "";


    cart.forEach(
        function(item) {


            const isOrdered =
                item.status === "Ordered";


            itemsHTML += `

                <div
                    class="cart-item"
                    data-id="${item.id}"
                >


                    ${
                        !isOrdered
                        ?
                        `
                            <div class="select-area">

                                <input
                                    type="checkbox"
                                    class="item-checkbox"
                                    value="${item.id}"
                                    onchange="updateSelectedItems()"
                                >

                            </div>
                        `
                        :
                        `
                            <div class="select-area">
                            </div>
                        `
                    }


                    <img
                        class="product-image"
                        src="${escapeHtml(item.image || '')}"
                        alt="${escapeHtml(item.name)}"
                        onerror="this.src='https://via.placeholder.com/100x100?text=Flower'"
                    >


                    <div class="product-info">


                        <div class="product-name">

                            🌸
                            ${escapeHtml(item.name)}

                        </div>


                        <div class="product-price">

                            ₹${Number(
                                item.price || 0
                            ).toFixed(2)}

                            per item

                        </div>


                        ${
                            isOrdered
                            ?
                            `
                                <span class="ordered-label">

                                    ✓ Already Ordered

                                </span>
                            `
                            :
                            `
                                <div class="quantity-area">


                                    <button
                                        class="quantity-btn"
                                        onclick="changeQuantity(
                                            ${item.id},
                                            ${item.quantity - 1}
                                        )"
                                        ${item.quantity <= 1 ? "disabled" : ""}
                                    >

                                        −

                                    </button>


                                    <span class="quantity-number">

                                        ${item.quantity}

                                    </span>


                                    <button
                                        class="quantity-btn"
                                        onclick="changeQuantity(
                                            ${item.id},
                                            ${item.quantity + 1}
                                        )"
                                        ${
                                            item.quantity >= item.stock
                                            ? "disabled"
                                            : ""
                                        }
                                    >

                                        +

                                    </button>


                                </div>


                                <div class="stock-text">

                                    Available stock:
                                    ${item.stock}

                                </div>
                            `
                        }

                    </div>


                    <div class="item-right">


                        <div class="item-subtotal">

                            ₹${Number(
                                item.subtotal || 0
                            ).toFixed(2)}

                        </div>


                        <button
                            class="remove-btn"
                            onclick="removeCartItem(${item.id})"
                        >

                            🗑 Remove

                        </button>


                    </div>


                </div>

            `;
        }
    );


    container.innerHTML = `

        <div class="cart-layout">


            <div class="cart-card">

                ${itemsHTML}

            </div>


            <div class="summary-card">


                <h3>
                    🧾 Cart Summary
                </h3>


                <div class="summary-row">

                    <span>
                        Active Items
                    </span>

                    <strong>
                        ${data.active_count || 0}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Ordered Items
                    </span>

                    <strong>
                        ${data.ordered_count || 0}
                    </strong>

                </div>


                <!-- SELECTED ITEMS SUMMARY -->

                <div class="selected-summary">


                    <div class="selected-summary-row">

                        <span>
                            Selected Items
                        </span>

                        <strong id="selectedCount">
                            0
                        </strong>

                    </div>


                    <div class="selected-summary-row">

                        <span>
                            Selected Total
                        </span>

                        <strong id="selectedTotal">
                            ₹0.00
                        </strong>

                    </div>


                </div>


                <div class="summary-row total">

                    <span>
                        Cart Total
                    </span>

                    <span>

                        ₹${Number(
                            data.total || 0
                        ).toFixed(2)}

                    </span>

                </div>


                <button
                    id="checkoutButton"
                    class="checkout-btn"
                    onclick="goToCheckout()"
                    disabled
                >

                    🛍 Proceed to Checkout

                </button>


                <button
                    class="clear-btn"
                    onclick="clearCart()"
                >

                    🗑 Clear Cart

                </button>


            </div>


        </div>

    `;


    /*
       Restore previously selected items
       if they still exist in cart.
    */

    restoreSelectedItems();


    updateSelectedItems();

}


/* =========================================================
   RESTORE SELECTED ITEMS
========================================================= */

function restoreSelectedItems() {

    const saved =
        localStorage.getItem(
            "selectedCartItems"
        );


    if (!saved) {

        return;
    }


    let selectedIds = [];


    try {

        selectedIds =
            JSON.parse(saved);

    } catch (error) {

        selectedIds = [];
    }


    if (!Array.isArray(selectedIds)) {

        return;
    }


    document
        .querySelectorAll(".item-checkbox")
        .forEach(
            function(checkbox) {

                const itemId =
                    Number(checkbox.value);


                if (
                    selectedIds.includes(itemId)
                ) {

                    checkbox.checked = true;
                }

            }
        );
}


/* =========================================================
   UPDATE SELECTED ITEMS
========================================================= */

function updateSelectedItems() {

    const checkboxes =
        document.querySelectorAll(
            ".item-checkbox:checked"
        );


    const selectedIds = [];


    let selectedTotal = 0;


    checkboxes.forEach(
        function(checkbox) {


            const cartItem =
                checkbox.closest(".cart-item");


            if (!cartItem) {

                return;
            }


            const subtotalElement =
                cartItem.querySelector(
                    ".item-subtotal"
                );


            const subtotalText =
                subtotalElement
                    ? subtotalElement.innerText
                    : "₹0";


            const subtotal =
                parseFloat(
                    subtotalText
                        .replace("₹", "")
                        .replace(/,/g, "")
                ) || 0;


            selectedIds.push(
                Number(checkbox.value)
            );


            selectedTotal +=
                subtotal;


            cartItem.classList.add(
                "selected-item"
            );

        }
    );


    document
        .querySelectorAll(".item-checkbox")
        .forEach(
            function(checkbox) {


                if (!checkbox.checked) {


                    const cartItem =
                        checkbox.closest(".cart-item");


                    if (cartItem) {

                        cartItem.classList.remove(
                            "selected-item"
                        );
                    }

                }

            }
        );


    const selectedCount =
        document.getElementById(
            "selectedCount"
        );


    const selectedTotalElement =
        document.getElementById(
            "selectedTotal"
        );


    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    if (selectedCount) {

        selectedCount.innerText =
            selectedIds.length;
    }


    if (selectedTotalElement) {

        selectedTotalElement.innerText =
            "₹" +
            selectedTotal.toFixed(2);
    }


    if (checkoutButton) {

        checkoutButton.disabled =
            selectedIds.length === 0;
    }


    /*
       Save selected cart IDs.
    */

    localStorage.setItem(
        "selectedCartItems",
        JSON.stringify(selectedIds)
    );
}


/* =========================================================
   CHANGE QUANTITY
========================================================= */

async function changeQuantity(
    cartId,
    quantity
) {


    if (quantity < 1) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${cartId}`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    credentials: "include",

                    body: JSON.stringify({

                        quantity:
                            quantity

                    })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to update quantity"
            );

            return;
        }


        loadCart();

    } catch (error) {

        console.error(error);


        alert(
            "Unable to update cart quantity."
        );
    }
}


/* =========================================================
   REMOVE ITEM
========================================================= */

async function removeCartItem(
    cartId
) {


    const confirmDelete =
        confirm(
            "Are you sure you want to remove this flower from cart?"
        );


    if (!confirmDelete) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${cartId}`,
                {

                    method: "DELETE",

                    credentials: "include"

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to remove item"
            );

            return;
        }


        /*
           Remove deleted item
           from selected items.
        */

        let selectedIds = [];


        try {

            selectedIds =
                JSON.parse(
                    localStorage.getItem(
                        "selectedCartItems"
                    )
                ) || [];

        } catch (error) {

            selectedIds = [];
        }


        selectedIds =
            selectedIds.filter(
                id =>
                    Number(id) !==
                    Number(cartId)
            );


        localStorage.setItem(
            "selectedCartItems",
            JSON.stringify(selectedIds)
        );


        loadCart();

    } catch (error) {

        console.error(error);


        alert(
            "Unable to remove item."
        );
    }
}


/* =========================================================
   CLEAR CART
========================================================= */

async function clearCart() {


    const user =
        getCurrentUser();


    if (!user || !user.id) {

        return;
    }


    const confirmClear =
        confirm(
            "Are you sure you want to clear your cart?"
        );


    if (!confirmClear) {

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/user/${user.id}`,
                {

                    method: "DELETE",

                    credentials: "include"

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to clear cart"
            );

            return;
        }


        /*
           Clear selected items too.
        */

        localStorage.removeItem(
            "selectedCartItems"
        );


        alert(
            "Cart cleared successfully."
        );


        loadCart();

    } catch (error) {

        console.error(error);


        alert(
            "Unable to clear cart."
        );
    }
}


/* =========================================================
   CHECKOUT SELECTED ITEMS ONLY
========================================================= */

function goToCheckout() {


    const checkboxes =
        document.querySelectorAll(
            ".item-checkbox:checked"
        );


    const selectedIds = [];


    checkboxes.forEach(
        function(checkbox) {

            selectedIds.push(
                Number(checkbox.value)
            );

        }
    );


    if (selectedIds.length === 0) {

        alert(
            "Please select at least one flower to checkout."
        );

        return;
    }


    /*
       Save selected cart IDs
    */

    localStorage.setItem(
        "selectedCartItems",
        JSON.stringify(selectedIds)
    );


    /*
       Send selected IDs
       to checkout page.
    */

    const selectedParam =
        selectedIds.join(",");


    window.location.href =
        "{{ url_for('checkout_page') }}" +
        "?selected=" +
        encodeURIComponent(
            selectedParam
        );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {


    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCart();

    }
);

</script>
