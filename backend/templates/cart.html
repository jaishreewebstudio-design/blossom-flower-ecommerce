<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Blossom Flower Shop</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #fff5f8;

            color: #333;

            min-height: 100vh;
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        .navbar {

            background: white;

            padding: 20px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 15px
                rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            color: #d63384;

            font-size: 25px;

            font-weight: bold;

            white-space: nowrap;
        }


        nav ul {

            list-style: none;

            display: flex;

            align-items: center;

            gap: 25px;
        }


        nav ul li a {

            text-decoration: none;

            color: #444;

            font-weight: 600;

            transition: 0.3s;
        }


        nav ul li a:hover {

            color: #d63384;
        }


        /* =====================================================
           MAIN SECTION
        ===================================================== */

        .cart-section {

            max-width: 1100px;

            margin: 45px auto;

            padding: 0 20px;
        }


        .cart-card {

            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }


        .page-title {

            color: #c2185b;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .page-subtitle {

            color: #777;

            margin-bottom: 25px;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 13px 16px;

            border-radius: 9px;

            margin-bottom: 20px;

            font-weight: bold;
        }


        .message.success {

            display: block;

            background: #e6f8ed;

            color: #16803c;

            border:
                1px solid #b7e5c7;
        }


        .message.error {

            display: block;

            background: #ffe7e7;

            color: #b42323;

            border:
                1px solid #f2b8b8;
        }


        /* =====================================================
           CART TOP BAR
        ===================================================== */

        .cart-top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 15px 18px;

            background: #fff0f5;

            border:
                1px solid #f0d6df;

            border-radius: 12px;

            margin-bottom: 20px;
        }


        .select-all-area {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #c2185b;

            font-weight: bold;
        }


        .select-all-area input {

            width: 18px;

            height: 18px;

            accent-color: #d63384;

            cursor: pointer;
        }


        .item-count {

            color: #777;

            font-size: 14px;
        }


        /* =====================================================
           CART ITEMS
        ===================================================== */

        .cart-items {

            border:
                1px solid #f0d6df;

            border-radius: 12px;

            overflow: hidden;
        }


        .cart-item {

            display: grid;

            grid-template-columns:
                45px
                100px
                1fr
                auto
                auto
                auto;

            align-items: center;

            gap: 18px;

            padding: 20px;

            border-bottom:
                1px solid #eeeeee;

            transition: 0.2s;
        }


        .cart-item:last-child {

            border-bottom: none;
        }


        .cart-item:hover {

            background: #fffafb;
        }


        /* =====================================================
           CHECKBOX
        ===================================================== */

        .item-checkbox {

            width: 18px;

            height: 18px;

            accent-color: #d63384;

            cursor: pointer;
        }


        /* =====================================================
           FLOWER IMAGE
        ===================================================== */

        .flower-image {

            width: 90px;

            height: 90px;

            border-radius: 12px;

            overflow: hidden;

            background: #fff0f5;

            display: flex;

            justify-content: center;

            align-items: center;

            border:
                1px solid #f0d6df;
        }


        .flower-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .flower-placeholder {

            font-size: 35px;
        }


        /* =====================================================
           PRODUCT INFORMATION
        ===================================================== */

        .product-info {

            min-width: 0;
        }


        .product-name {

            color: #444;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .product-description {

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            max-width: 420px;
        }


        .product-price {

            color: #d63384;

            font-size: 16px;

            font-weight: bold;

            margin-top: 8px;
        }


        /* =====================================================
           QUANTITY
        ===================================================== */

        .quantity-box {

            display: flex;

            align-items: center;

            border:
                1px solid #e7bfd0;

            border-radius: 8px;

            overflow: hidden;

            background: white;
        }


        .quantity-btn {

            width: 35px;

            height: 35px;

            border: none;

            background: #ffe0eb;

            color: #c2185b;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .quantity-btn:hover {

            background: #f8c5d4;
        }


        .quantity-value {

            min-width: 40px;

            text-align: center;

            font-weight: bold;

            color: #444;
        }


        /* =====================================================
           SUBTOTAL
        ===================================================== */

        .item-subtotal {

            color: #d63384;

            font-weight: bold;

            font-size: 17px;

            white-space: nowrap;
        }


        /* =====================================================
           REMOVE BUTTON
        ===================================================== */

        .remove-btn {

            border: none;

            background: #ffe7e7;

            color: #b42323;

            padding: 9px 12px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .remove-btn:hover {

            background: #ffd0d0;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .cart-summary {

            margin-top: 25px;

            border:
                1px solid #f0d6df;

            border-radius: 12px;

            padding: 22px;

            background: #fffafb;
        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 8px 0;

            color: #555;
        }


        .summary-row.selected {

            color: #c2185b;

            font-weight: bold;
        }


        .summary-total {

            margin-top: 12px;

            padding-top: 15px;

            border-top:
                1px solid #e8d5dc;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .summary-total-label {

            color: #c2185b;

            font-size: 23px;

            font-weight: bold;
        }


        .summary-total-price {

            color: #d63384;

            font-size: 26px;

            font-weight: bold;
        }


        /* =====================================================
           BUTTON AREA
        ===================================================== */

        .button-area {

            display: flex;

            justify-content: flex-end;

            gap: 15px;

            margin-top: 25px;
        }


        .btn {

            border: none;

            padding: 14px 24px;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .continue-btn {

            background: #ffe0eb;

            color: #c2185b;
        }


        .continue-btn:hover {

            background: #f8c5d4;
        }


        .checkout-btn {

            background: #d63384;

            color: white;

            min-width: 190px;
        }


        .checkout-btn:hover {

            background: #c2185b;
        }


        .checkout-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =====================================================
           EMPTY CART
        ===================================================== */

        .empty-cart {

            text-align: center;

            padding: 65px 20px;
        }


        .empty-icon {

            font-size: 65px;

            margin-bottom: 15px;
        }


        .empty-cart h2 {

            color: #d63384;

            margin-bottom: 10px;
        }


        .empty-cart p {

            color: #777;

            margin-bottom: 25px;
        }


        .shop-btn {

            display: inline-block;

            text-decoration: none;

            background: #d63384;

            color: white;

            padding: 12px 22px;

            border-radius: 8px;

            font-weight: bold;
        }


        .shop-btn:hover {

            background: #c2185b;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            text-align: center;

            padding: 50px;

            color: #777;

            font-size: 17px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .cart-item {

                grid-template-columns:
                    35px
                    80px
                    1fr
                    auto;

                gap: 14px;
            }


            .quantity-box {

                grid-column: 3;
                width: fit-content;
            }


            .item-subtotal {

                grid-column: 4;
                grid-row: 2;
            }


            .remove-btn {

                grid-column: 4;
                grid-row: 1;
            }

        }


        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 20px;
            }


            nav ul {

                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }


            .cart-section {

                margin-top: 25px;

                padding: 0 12px;
            }


            .cart-card {

                padding: 20px;
            }


            .cart-top-bar {

                flex-direction: column;

                align-items: flex-start;
            }


            .cart-item {

                grid-template-columns:
                    35px
                    75px
                    1fr;

                gap: 12px;

                padding: 15px;
            }


            .flower-image {

                width: 70px;

                height: 70px;
            }


            .quantity-box {

                grid-column: 3;

                grid-row: 2;
            }


            .item-subtotal {

                grid-column: 3;

                grid-row: 3;
            }


            .remove-btn {

                grid-column: 3;

                grid-row: 4;

                width: fit-content;
            }


            .button-area {

                flex-direction: column;
            }


            .btn {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="logo">
        🌸 Blossom Flower Shop
    </div>


    <nav>

        <ul>

            <li>
                <a href="{{ url_for('dashboard_page') }}">
                    Dashboard
                </a>
            </li>


            <li>
                <a href="{{ url_for('home_page') }}">
                    Home
                </a>
            </li>


            <li>
                <a href="{{ url_for('flowers_page') }}">
                    Flowers
                </a>
            </li>


            <li>
                <a href="{{ url_for('cart_page') }}">
                    Cart
                </a>
            </li>


            <li>
                <a href="{{ url_for('orders_page') }}">
                    Orders
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================================================
     CART SECTION
========================================================= -->

<section class="cart-section">

    <div class="cart-card">


        <h1 class="page-title">
            🌸 Shopping Cart
        </h1>


        <p class="page-subtitle">
            Select the flowers you want to order.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>



        <!-- =================================================
             CART CONTENT
        ================================================== -->

        <div id="cartContent">

            <div class="loading">
                ⏳ Loading your cart...
            </div>

        </div>


    </div>

</section>



<script>


/* =========================================================
   API
========================================================= */

const API_URL = "";



/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser() {

    const userData =
        localStorage.getItem("currentUser");


    if (!userData) {

        return null;

    }


    try {

        return JSON.parse(userData);

    } catch (error) {

        console.error(
            "Current User Error:",
            error
        );

        return null;

    }

}



/* =========================================================
   VARIABLES
========================================================= */

let cartItems = [];

let selectedCartIds = [];



/* =========================================================
   LOAD SAVED SELECTION
========================================================= */

function loadSavedSelection() {

    const saved =
        localStorage.getItem(
            "selectedCartIds"
        );


    if (!saved) {

        selectedCartIds = [];

        return;

    }


    try {

        const parsed =
            JSON.parse(saved);


        if (!Array.isArray(parsed)) {

            selectedCartIds = [];

            return;

        }


        selectedCartIds =
            parsed
                .map(id => Number(id))
                .filter(
                    id =>
                        Number.isInteger(id) &&
                        id > 0
                );

    } catch (error) {

        console.error(
            "Selection Error:",
            error
        );

        selectedCartIds = [];

    }

}



/* =========================================================
   SAVE SELECTION
========================================================= */

function saveSelectedIds() {

    localStorage.setItem(
        "selectedCartIds",
        JSON.stringify(
            selectedCartIds
        )
    );

}



/* =========================================================
   LOAD CART
========================================================= */

async function loadCart() {

    const user =
        getCurrentUser();


    if (!user || !user.id) {

        document.getElementById(
            "cartContent"
        ).innerHTML = `

            <div class="empty-cart">

                <div class="empty-icon">
                    🌸
                </div>

                <h2>
                    Please Login
                </h2>

                <p>
                    Please login to view your shopping cart.
                </p>

                <a
                    href="{{ url_for('login_page') }}"
                    class="shop-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;

    }


    loadSavedSelection();


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${user.id}`,
                {
                    method: "GET",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load cart."
            );

        }


        cartItems =
            Array.isArray(data.cart)
                ? data.cart
                : [];


        /*
         * Remove IDs from localStorage
         * that no longer exist in cart.
         */

        const existingIds =
            cartItems.map(
                item => Number(item.id)
            );


        selectedCartIds =
            selectedCartIds.filter(
                id =>
                    existingIds.includes(id)
            );


        saveSelectedIds();


        displayCart();


    } catch (error) {

        console.error(
            "Cart Error:",
            error
        );


        document.getElementById(
            "cartContent"
        ).innerHTML = `

            <div class="empty-cart">

                <div class="empty-icon">
                    🌸
                </div>

                <h2>
                    Unable to Load Cart
                </h2>

                <p>
                    ${escapeHtml(
                        error.message ||
                        "Something went wrong."
                    )}
                </p>

                <button
                    class="btn checkout-btn"
                    onclick="loadCart()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}



/* =========================================================
   DISPLAY CART
========================================================= */

function displayCart() {

    const container =
        document.getElementById(
            "cartContent"
        );


    if (
        !Array.isArray(cartItems) ||
        cartItems.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-icon">
                    🌸
                </div>

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    Add some beautiful flowers to your cart.
                </p>

                <a
                    href="{{ url_for('flowers_page') }}"
                    class="shop-btn"
                >
                    🌸 Browse Flowers
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="cart-top-bar">

            <label class="select-all-area">

                <input
                    type="checkbox"
                    id="selectAll"
                    onchange="toggleSelectAll()"
                >

                <span>
                    Select All
                </span>

            </label>


            <div
                id="itemCount"
                class="item-count"
            >
                0 items selected
            </div>

        </div>


        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <div class="cart-summary">

            <div class="summary-row">

                <span>
                    Total Cart Items
                </span>

                <strong id="cartItemCount">
                    0
                </strong>

            </div>


            <div class="summary-row selected">

                <span>
                    Selected Items
                </span>

                <strong id="selectedItemCount">
                    0
                </strong>

            </div>


            <div class="summary-total">

                <div class="summary-total-label">
                    Total
                </div>

                <div
                    id="selectedTotal"
                    class="summary-total-price"
                >
                    ₹0.00
                </div>

            </div>

        </div>


        <div class="button-area">

            <a
                href="{{ url_for('flowers_page') }}"
                class="btn continue-btn"
            >
                ← Continue Shopping
            </a>


            <button
                type="button"
                id="checkoutButton"
                class="btn checkout-btn"
                onclick="goToCheckout()"
                disabled
            >
                Proceed to Checkout →
            </button>

        </div>

    `;


    renderCartItems();

    updateCartSummary();

}



/* =========================================================
   RENDER CART ITEMS
========================================================= */

function renderCartItems() {

    const container =
        document.getElementById(
            "cartItems"
        );


    container.innerHTML = "";


    cartItems.forEach(
        function(item) {


            const id =
                Number(item.id);


            const price =
                Number(
                    item.price || 0
                );


            const quantity =
                Number(
                    item.quantity || 1
                );


            const subtotal =
                price * quantity;


            const isSelected =
                selectedCartIds.includes(
                    id
                );


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "cart-item";


            row.dataset.id =
                id;


            let imageHtml =
                `<div class="flower-placeholder">🌸</div>`;


            if (
                item.image ||
                item.image_url
            ) {

                const image =
                    item.image ||
                    item.image_url;


                imageHtml = `

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(
                            item.name || "Flower"
                        )}"
                        onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;flower-placeholder&quot;>🌸</div>';"
                    >

                `;

            }


            row.innerHTML = `

                <input
                    type="checkbox"
                    class="item-checkbox"
                    ${isSelected ? "checked" : ""}
                    onchange="toggleItemSelection(${id})"
                    aria-label="Select ${escapeHtml(
                        item.name || "flower"
                    )}"
                >


                <div class="flower-image">

                    ${imageHtml}

                </div>


                <div class="product-info">

                    <div class="product-name">

                        🌸
                        ${escapeHtml(
                            item.name ||
                            "Flower"
                        )}

                    </div>


                    <div class="product-description">

                        ${escapeHtml(
                            item.description ||
                            "Beautiful fresh flower."
                        )}

                    </div>


                    <div class="product-price">

                        ₹${price.toFixed(2)}

                    </div>

                </div>


                <div class="quantity-box">

                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="changeQuantity(${id}, -1)"
                    >
                        −
                    </button>


                    <span
                        class="quantity-value"
                        id="quantity-${id}"
                    >
                        ${quantity}
                    </span>


                    <button
                        type="button"
                        class="quantity-btn"
                        onclick="changeQuantity(${id}, 1)"
                    >
                        +
                    </button>

                </div>


                <div
                    class="item-subtotal"
                    id="subtotal-${id}"
                >
                    ₹${subtotal.toFixed(2)}
                </div>


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeCartItem(${id})"
                >
                    🗑 Remove
                </button>

            `;


            container.appendChild(
                row
            );

        }
    );

}



/* =========================================================
   TOGGLE ITEM SELECTION
========================================================= */

function toggleItemSelection(
    cartId
) {

    cartId =
        Number(cartId);


    if (
        selectedCartIds.includes(
            cartId
        )
    ) {

        selectedCartIds =
            selectedCartIds.filter(
                id =>
                    id !== cartId
            );

    } else {

        selectedCartIds.push(
            cartId
        );

    }


    saveSelectedIds();

    updateCartSummary();

    updateSelectAllCheckbox();

}



/* =========================================================
   SELECT ALL
========================================================= */

function toggleSelectAll() {

    const checkbox =
        document.getElementById(
            "selectAll"
        );


    if (
        !checkbox
    ) {

        return;

    }


    if (checkbox.checked) {

        selectedCartIds =
            cartItems.map(
                item =>
                    Number(item.id)
            );

    } else {

        selectedCartIds = [];

    }


    saveSelectedIds();

    renderCartItems();

    updateCartSummary();

}



/* =========================================================
   UPDATE SELECT ALL CHECKBOX
========================================================= */

function updateSelectAllCheckbox() {

    const checkbox =
        document.getElementById(
            "selectAll"
        );


    if (
        !checkbox ||
        cartItems.length === 0
    ) {

        return;

    }


    const allSelected =
        cartItems.every(
            item =>
                selectedCartIds.includes(
                    Number(item.id)
                )
        );


    checkbox.checked =
        allSelected;


    checkbox.indeterminate =
        !allSelected &&
        selectedCartIds.length > 0;

}



/* =========================================================
   CHANGE QUANTITY
========================================================= */

async function changeQuantity(
    cartId,
    change
) {

    const item =
        cartItems.find(
            product =>
                Number(product.id) ===
                Number(cartId)
        );


    if (!item) {

        return;

    }


    const currentQuantity =
        Number(
            item.quantity || 1
        );


    const newQuantity =
        currentQuantity +
        Number(change);


    if (newQuantity < 1) {

        return;

    }


    try {

        /*
         * Try PUT first.
         */

        let response =
            await fetch(
                `${API_URL}/api/cart/${cartId}`,
                {
                    method: "PUT",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            quantity:
                                newQuantity
                        })
                }
            );


        /*
         * Some backend versions may
         * use PATCH instead.
         *
         * The main API remains PUT.
         */

        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to update quantity."
            );

        }


        item.quantity =
            newQuantity;


        renderCartItems();

        updateCartSummary();


    } catch (error) {

        console.error(
            "Quantity Update Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to update quantity.",
            "error"
        );

    }

}



/* =========================================================
   REMOVE CART ITEM
========================================================= */

async function removeCartItem(
    cartId
) {

    const confirmed =
        confirm(
            "Are you sure you want to remove this flower from your cart?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${cartId}`,
                {
                    method: "DELETE",

                    credentials: "include",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to remove item."
            );

        }


        /*
         * Remove from local selected IDs.
         */

        selectedCartIds =
            selectedCartIds.filter(
                id =>
                    Number(id) !==
                    Number(cartId)
            );


        saveSelectedIds();


        /*
         * Remove from local cart.
         */

        cartItems =
            cartItems.filter(
                item =>
                    Number(item.id) !==
                    Number(cartId)
            );


        displayCart();


        showMessage(
            "Flower removed from cart successfully.",
            "success"
        );


    } catch (error) {

        console.error(
            "Remove Cart Error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to remove item.",
            "error"
        );

    }

}



/* =========================================================
   UPDATE CART SUMMARY
========================================================= */

function updateCartSummary() {

    const totalCartItems =
        cartItems.reduce(
            function(total, item) {

                return (
                    total +
                    Number(
                        item.quantity || 0
                    )
                );

            },
            0
        );


    const selectedItems =
        cartItems.filter(
            item =>
                selectedCartIds.includes(
                    Number(item.id)
                )
        );


    const selectedQuantity =
        selectedItems.reduce(
            function(total, item) {

                return (
                    total +
                    Number(
                        item.quantity || 0
                    )
                );

            },
            0
        );


    const selectedTotal =
        selectedItems.reduce(
            function(total, item) {

                return (
                    total +
                    Number(
                        item.price || 0
                    ) *
                    Number(
                        item.quantity || 0
                    )
                );

            },
            0
        );


    const itemCount =
        document.getElementById(
            "itemCount"
        );


    const cartItemCount =
        document.getElementById(
            "cartItemCount"
        );


    const selectedItemCount =
        document.getElementById(
            "selectedItemCount"
        );


    const totalElement =
        document.getElementById(
            "selectedTotal"
        );


    const checkoutButton =
        document.getElementById(
            "checkoutButton"
        );


    if (itemCount) {

        itemCount.textContent =
            `${selectedQuantity} item${
                selectedQuantity === 1
                    ? ""
                    : "s"
            } selected`;

    }


    if (cartItemCount) {

        cartItemCount.textContent =
            totalCartItems;

    }


    if (selectedItemCount) {

        selectedItemCount.textContent =
            selectedQuantity;

    }


    if (totalElement) {

        totalElement.textContent =
            `₹${selectedTotal.toFixed(2)}`;

    }


    if (checkoutButton) {

        checkoutButton.disabled =
            selectedItems.length === 0;

    }


    updateSelectAllCheckbox();

}



/* =========================================================
   GO TO CHECKOUT
========================================================= */

function goToCheckout() {

    /*
     * IMPORTANT:
     *
     * Only selected IDs are sent.
     */

    if (
        selectedCartIds.length === 0
    ) {

        showMessage(
            "Please select at least one flower.",
            "error"
        );

        return;

    }


    saveSelectedIds();


    const ids =
        selectedCartIds.join(",");


    /*
     * Checkout URL:
     *
     * /checkout?cart_ids=1,3,5
     */

    window.location.href =
        `{{ url_for('checkout_page') }}?cart_ids=${encodeURIComponent(ids)}`;

}



/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    if (!message) {

        return;

    }


    message.textContent =
        text;


    message.className =
        `message ${type}`;


    /*
     * Automatically hide success
     * messages after 3 seconds.
     */

    if (type === "success") {

        setTimeout(
            function() {

                message.className =
                    "message";

                message.textContent =
                    "";

            },
            3000
        );

    }

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCart();

    }
);


</script>
