<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | Blossom Flower Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #fff0f6;

            min-height: 100vh;

            color: #333;

        }


        /* =====================================================
           DASHBOARD
        ===================================================== */

        .dashboard {

            width: 100%;

            padding: 32px;

        }


        .dashboard-title {

            text-align: center;

            color: #d92d82;

            font-size: 34px;

            font-weight: 800;

            margin-bottom: 30px;

        }


        /* =====================================================
           GRID
        ===================================================== */

        .dashboard-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(300px, 1fr)
                );

            gap: 30px;

            max-width: 1100px;

            margin: auto;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .dashboard-card {

            background: #ffffff;

            border-radius: 20px;

            min-height: 280px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

            box-shadow:
                0 8px 25px
                rgba(
                    217,
                    45,
                    130,
                    0.08
                );

        }


        /* =====================================================
           CARD TITLE
        ===================================================== */

        .card-title {

            color: #d92d82;

            font-size: 26px;

            font-weight: 700;

            margin-bottom: 20px;

        }


        /* =====================================================
           ICON
        ===================================================== */

        .card-icon {

            font-size: 42px;

            margin-bottom: 12px;

        }


        /* =====================================================
           COUNT
        ===================================================== */

        .card-count {

            font-size: 48px;

            font-weight: 800;

            color: #000;

            margin-bottom: 12px;

            min-height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .card-description {

            color: #666;

            font-size: 20px;

            margin-bottom: 22px;

        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .card-button {

            border: none;

            background: #ff1493;

            color: white;

            font-size: 17px;

            font-weight: 700;

            padding: 13px 28px;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.2s;

        }


        .card-button:hover {

            background: #d90b78;

            transform:
                translateY(-1px);

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            opacity: 0.5;

        }


        /* =====================================================
           ERROR
        ===================================================== */

        .count-error {

            font-size: 20px;

            color: #d92d82;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 750px) {

            .dashboard {

                padding: 18px;

            }


            .dashboard-grid {

                grid-template-columns: 1fr;

            }


            .dashboard-title {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- =====================================================
         DASHBOARD TITLE
    ====================================================== -->

    <h1 class="dashboard-title">

        🌸 Blossom Flower Shop Dashboard

    </h1>


    <!-- =====================================================
         DASHBOARD GRID
    ====================================================== -->

    <div class="dashboard-grid">


        <!-- =================================================
             HOME
        ================================================== -->

        <div class="dashboard-card">

            <div class="card-icon">

                🏠

            </div>


            <div class="card-title">

                Home

            </div>


            <div class="card-description">

                Explore Beautiful Flowers

            </div>


            <button
                type="button"
                class="card-button"
                onclick="window.location.href='/home'"
            >

                Explore

            </button>

        </div>


        <!-- =================================================
             FLOWERS
        ================================================== -->

        <div class="dashboard-card">

            <div class="card-icon">

                🌹

            </div>


            <div class="card-title">

                Flowers

            </div>


            <div
                id="flowersCount"
                class="card-count loading"
            >

                0

            </div>


            <div class="card-description">

                Fresh Flower Collection

            </div>


            <button
                type="button"
                class="card-button"
                onclick="window.location.href='/flower'"
            >

                Shop Now

            </button>

        </div>


        <!-- =================================================
             CART
        ================================================== -->

        <div class="dashboard-card">

            <div class="card-icon">

                🛒

            </div>


            <div class="card-title">

                Cart

            </div>


            <div
                id="cartCount"
                class="card-count loading"
            >

                0

            </div>


            <div class="card-description">

                Items in Cart

            </div>


            <button
                type="button"
                class="card-button"
                onclick="window.location.href='/cart'"
            >

                View Cart

            </button>

        </div>


        <!-- =================================================
             ORDERS
        ================================================== -->

        <div class="dashboard-card">

            <div class="card-icon">

                📦

            </div>


            <div class="card-title">

                Orders

            </div>


            <div
                id="ordersCount"
                class="card-count loading"
            >

                0

            </div>


            <div class="card-description">

                Ordered Items

            </div>


            <button
                type="button"
                class="card-button"
                onclick="window.location.href='/orders'"
            >

                View Orders

            </button>

        </div>


    </div>


</div>


<script>


    /* =========================================================
       GET ELEMENTS
    ========================================================= */

    const flowersCount =
        document.getElementById(
            "flowersCount"
        );


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    const ordersCount =
        document.getElementById(
            "ordersCount"
        );


    /* =========================================================
       LOAD DASHBOARD COUNTS
    ========================================================= */

    async function loadDashboardCounts() {

        try {

            /* ---------------------------------------------
               Show loading
            --------------------------------------------- */

            flowersCount.classList.add(
                "loading"
            );

            cartCount.classList.add(
                "loading"
            );

            ordersCount.classList.add(
                "loading"
            );


            /* ---------------------------------------------
               API REQUEST
            --------------------------------------------- */

            const response = await fetch(
                "/api/dashboard",
                {
                    method: "GET",

                    credentials: "include",

                    cache: "no-store",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


            /* ---------------------------------------------
               RESPONSE JSON
            --------------------------------------------- */

            const data =
                await response.json();


            console.log(
                "Dashboard API:",
                data
            );


            /* ---------------------------------------------
               LOGIN CHECK
            --------------------------------------------- */

            if (
                response.status === 401
            ) {

                window.location.href =
                    "/login";

                return;

            }


            /* ---------------------------------------------
               API ERROR
            --------------------------------------------- */

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Unable to load dashboard"
                );

            }


            /* =================================================
               COUNTS
            ================================================= */

            const counts =
                data.counts || {};


            /* =================================================
               FLOWERS COUNT
            ================================================= */

            flowersCount.textContent =
                Number(
                    counts.flowers || 0
                );


            flowersCount.classList.remove(
                "loading"
            );


            /* =================================================
               CART COUNT
               
               IMPORTANT:
               This is TOTAL QUANTITY in cart,
               not number of cart rows.
               
               Example:
               Rose x 2
               Lily x 3
               Dashboard = 5
            ================================================= */

            cartCount.textContent =
                Number(
                    counts.cart || 0
                );


            cartCount.classList.remove(
                "loading"
            );


            /* =================================================
               ORDERS COUNT
               
               IMPORTANT:
               This is TOTAL ORDERED QUANTITY,
               not number of orders.
               
               Example:
               Order 1 = Rose x 2
               Order 2 = Lily x 3
               Dashboard = 5
            ================================================= */

            ordersCount.textContent =
                Number(
                    counts.orders || 0
                );


            ordersCount.classList.remove(
                "loading"
            );


        }
        catch (error) {

            console.error(
                "Dashboard Error:",
                error
            );


            /* ---------------------------------------------
               Error display
            --------------------------------------------- */

            flowersCount.textContent =
                "0";

            cartCount.textContent =
                "0";

            ordersCount.textContent =
                "0";


            flowersCount.classList.remove(
                "loading"
            );

            cartCount.classList.remove(
                "loading"
            );

            ordersCount.classList.remove(
                "loading"
            );

        }

    }


    /* =========================================================
       FIRST LOAD
    ========================================================= */

    loadDashboardCounts();


    /* =========================================================
       REFRESH WHEN USER RETURNS TO TAB
    ========================================================= */

    window.addEventListener(
        "focus",
        function () {

            loadDashboardCounts();

        }
    );


    /* =========================================================
       REFRESH WHEN PAGE BECOMES VISIBLE
    ========================================================= */

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.visibilityState ===
                "visible"
            ) {

                loadDashboardCounts();

            }

        }
    );


    /* =========================================================
       REFRESH WHEN BROWSER BACK/FORWARD
    ========================================================= */

    window.addEventListener(
        "pageshow",
        function () {

            loadDashboardCounts();

        }
    );


</script>


</body>

</html>
